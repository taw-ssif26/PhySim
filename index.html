<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Simulation Laboratory</title>
    <!-- Premium Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* =========================================================
           GLOBAL CSS & VARIABLES
           ========================================================= */
        :root {
            --bg-base: #06080a;
            --bg-surface: #0e1115;
            --bg-surface-elevated: #14191f;
            --border-subtle: #1c232b;
            --border-accent: #2b3541;
            
            --text-primary: #f0f3f6;
            --text-secondary: #8c9ba5;
            --text-muted: #4e5c6a;
            
            --accent-cyan: #00f0ff;
            --accent-cyan-glow: rgba(0, 240, 255, 0.2);
            --accent-violet: #9b4dff;
            --accent-orange: #ff6b35;
            --accent-red: #ff3e3e;
            --accent-blue: #2f80ed;
            --accent-yellow: #f2c94c;
            --accent-green: #27ae60;
            
            --font-ui: 'Inter', system-ui, sans-serif;
            --font-display: 'Space Grotesk', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            
            --transition-smooth: 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: var(--font-ui);
            line-height: 1.5;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* Technical Grid Background Overlay */
        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.01) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.01) 1px, transparent 1px);
            background-size: 30px 30px;
            pointer-events: none;
            z-index: 1;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-base);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-subtle);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--border-accent);
        }

        /* Layout Framework */
        header {
            position: sticky;
            top: 0;
            width: 100%;
            height: 70px;
            background-color: rgba(6, 8, 10, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            z-index: 100;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .logo-symbol {
            width: 20px;
            height: 20px;
            border: 2px solid var(--accent-cyan);
            border-radius: 50%;
            position: relative;
            animation: pulse-ring 6s infinite linear;
        }

        .logo-symbol::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 6px;
            height: 6px;
            background: var(--accent-cyan);
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        @keyframes pulse-ring {
            0% { transform: rotate(0deg); border-style: solid; }
            50% { border-color: var(--accent-violet); }
            100% { transform: rotate(360deg); }
        }

        .logo-text {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 1.15rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .logo-text span {
            color: var(--accent-cyan);
            font-weight: 300;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 32px;
        }

        nav a {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-secondary);
            transition: var(--transition-smooth);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
        }

        nav a:hover, nav a.active {
            color: var(--accent-cyan);
        }

        .nav-status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: rgba(0, 240, 255, 0.04);
            border: 1px solid rgba(0, 240, 255, 0.15);
            border-radius: 4px;
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--accent-cyan);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: var(--accent-cyan);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-cyan);
            animation: pulse-dot 1.8s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        main {
            position: relative;
            z-index: 10;
            min-height: calc(100vh - 70px);
        }

        /* Generic Utilities */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 22px;
            background: var(--bg-surface-elevated);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            font-family: var(--font-ui);
            font-size: 0.85rem;
            font-weight: 500;
            border-radius: 4px;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .btn:hover {
            border-color: var(--accent-cyan);
            background: rgba(0, 240, 255, 0.02);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.05);
        }

        .btn-primary {
            background: var(--accent-cyan);
            color: var(--bg-base);
            border: 1px solid var(--accent-cyan);
            font-weight: 600;
        }

        .btn-primary:hover {
            background: #00d2e0;
            border-color: #00d2e0;
            color: var(--bg-base);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
        }

        /* =========================================================
           HOME VIEW STYLES
           ========================================================= */
        .hero {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 140px 20px 100px 20px;
            overflow: hidden;
        }

        .hero-canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.35;
            pointer-events: none;
        }

        .hero-pretitle {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--accent-cyan);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .hero-title {
            font-family: var(--font-display);
            font-size: clamp(3.2rem, 7vw, 5.5rem);
            font-weight: 700;
            line-height: 1.05;
            letter-spacing: -2px;
            margin-bottom: 24px;
            background: linear-gradient(135deg, #fff 50%, var(--text-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-description {
            max-width: 700px;
            font-size: 1.15rem;
            color: var(--text-secondary);
            margin-bottom: 40px;
            font-weight: 300;
        }

        /* Spotlight Card Block */
        .spotlight-card {
            background: linear-gradient(135deg, var(--bg-surface), rgba(16, 21, 28, 0.7));
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 32px;
            max-width: 600px;
            margin: 0 auto 80px auto;
            text-align: left;
            position: relative;
        }

        .spotlight-badge {
            position: absolute;
            top: -12px;
            left: 24px;
            background: var(--accent-cyan);
            color: var(--bg-base);
            font-family: var(--font-mono);
            font-size: 0.7rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .spotlight-title {
            font-family: var(--font-display);
            font-size: 1.4rem;
            margin-bottom: 12px;
        }

        .spotlight-title a {
            color: var(--accent-cyan);
            text-decoration: underline;
            text-underline-offset: 4px;
            transition: var(--transition-smooth);
        }

        .spotlight-title a:hover {
            color: #00d2e0;
        }

        .home-section {
            padding: 40px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .section-header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            margin-bottom: 40px;
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: 16px;
        }

        .section-title-wrapper h2 {
            font-family: var(--font-display);
            font-size: 2rem;
            font-weight: 600;
        }

        .section-title-wrapper p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-top: 4px;
        }

        /* =========================================================
           BROWSER STYLES
           ========================================================= */
        .browser-layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            min-height: calc(100vh - 70px);
            max-width: 100%;
        }

        .browser-sidebar {
            border-right: 1px solid var(--border-subtle);
            padding: 32px;
            background-color: rgba(14, 17, 21, 0.4);
            overflow-y: auto;
            max-height: calc(100vh - 70px);
        }

        .sidebar-section {
            margin-bottom: 32px;
        }

        .sidebar-title {
            font-family: var(--font-display);
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .category-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .category-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            border-radius: 4px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .category-item:hover, .category-item.active {
            background-color: var(--bg-surface-elevated);
            color: var(--text-primary);
        }

        .category-item.active {
            border-left: 2px solid var(--accent-cyan);
            padding-left: 12px;
        }

        .category-count {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            background-color: rgba(255, 255, 255, 0.04);
            padding: 2px 6px;
            border-radius: 3px;
            color: var(--text-muted);
        }

        .browser-main {
            padding: 40px;
            overflow-y: auto;
            max-height: calc(100vh - 70px);
        }

        .search-bar-container {
            display: flex;
            gap: 16px;
            margin-bottom: 40px;
        }

        .search-input-wrapper {
            position: relative;
            flex: 1;
        }

        .search-input {
            width: 100%;
            height: 52px;
            background-color: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            padding: 0 16px 0 54px;
            color: var(--text-primary);
            font-family: var(--font-ui);
            font-size: 1rem;
            transition: var(--transition-smooth);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent-cyan);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.08);
        }

        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        /* Catalog-style Cards */
        .experiment-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .experiment-card {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: var(--transition-smooth);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            min-height: 220px;
        }

        .experiment-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-violet));
            opacity: 0;
            transition: var(--transition-smooth);
        }

        .experiment-card:hover {
            transform: translateY(-4px);
            border-color: var(--border-accent);
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.5);
        }

        .experiment-card:hover::before {
            opacity: 1;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 14px;
        }

        .card-meta {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--accent-cyan);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card-difficulty {
            font-size: 0.65rem;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .diff-beginner { background: rgba(0, 240, 255, 0.08); color: var(--accent-cyan); }
        .diff-intermediate { background: rgba(255, 107, 53, 0.08); color: var(--accent-orange); }
        .diff-advanced { background: rgba(155, 77, 255, 0.08); color: #b780ff; }

        .card-title {
            font-family: var(--font-display);
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .card-description {
            color: var(--text-secondary);
            font-size: 0.85rem;
            line-height: 1.45;
            margin-bottom: 20px;
            flex-grow: 1;
        }

        .card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: auto;
        }

        .tag {
            font-family: var(--font-mono);
            font-size: 0.65rem;
            background-color: var(--bg-surface-elevated);
            color: var(--text-secondary);
            padding: 3px 8px;
            border-radius: 3px;
        }

        /* =========================================================
           EXPERIMENT WORKSPACE LAYOUT
           ========================================================= */
        .workspace {
            display: flex;
            flex-direction: column;
            min-height: calc(100vh - 70px);
            background-color: var(--bg-base);
        }

        .workspace-header {
            border-bottom: 1px solid var(--border-subtle);
            padding: 24px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--bg-surface);
        }

        .breadcrumb {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .breadcrumb span {
            color: var(--accent-cyan);
            cursor: pointer;
        }

        .workspace-title {
            font-family: var(--font-display);
            font-size: 1.6rem;
            font-weight: 600;
        }

        .workspace-grid {
            display: grid;
            grid-template-columns: 1fr 360px;
            flex-grow: 1;
            min-height: 520px;
        }

        .canvas-area {
            position: relative;
            background-color: #080a0d;
            display: flex;
            align-items: center;
            justify-content: center;
            border-right: 1px solid var(--border-subtle);
            padding: 30px;
            overflow: hidden;
        }

        .simulation-canvas-wrapper {
            position: relative;
            width: 100%;
            max-width: 860px;
            aspect-ratio: 16/10;
            background-color: #040507;
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            overflow: hidden;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.8);
        }

        .simulation-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .canvas-toolbar {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(14, 17, 21, 0.95);
            border: 1px solid var(--border-accent);
            border-radius: 6px;
            display: flex;
            padding: 6px;
            gap: 6px;
            backdrop-filter: blur(8px);
            z-index: 20;
        }

        .toolbar-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            width: 36px;
            height: 36px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition-smooth);
            font-size: 1.1rem;
        }

        .toolbar-btn:hover {
            color: var(--accent-cyan);
            background-color: rgba(255, 255, 255, 0.05);
        }

        .toolbar-btn.active {
            color: var(--bg-base);
            background-color: var(--accent-cyan);
        }

        /* Controls sidebar */
        .workspace-sidebar {
            display: flex;
            flex-direction: column;
            background-color: var(--bg-surface);
            overflow-y: auto;
            max-height: calc(100vh - 150px);
        }

        .sidebar-panel {
            padding: 24px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .sidebar-panel-title {
            font-family: var(--font-display);
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-secondary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-label-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px;
            font-size: 0.8rem;
        }

        .control-label {
            color: var(--text-secondary);
            font-weight: 500;
        }

        .control-value {
            font-family: var(--font-mono);
            color: var(--accent-cyan);
        }

        .sim-slider {
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            height: 4px;
            border-radius: 2px;
            background: var(--border-subtle);
            outline: none;
            transition: var(--transition-smooth);
        }

        .sim-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent-cyan);
            cursor: pointer;
            border: 2px solid var(--bg-surface);
            box-shadow: 0 0 10px var(--accent-cyan-glow);
        }

        /* Instrumentation list */
        .instrumentation-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .instrumentation-item {
            background-color: var(--bg-surface-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: 4px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .instrument-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
        }

        .instrument-value {
            font-family: var(--font-mono);
            font-size: 0.95rem;
            color: var(--accent-cyan);
            font-weight: 500;
        }

        /* Educational Section */
        .educational-area {
            background-color: var(--bg-surface);
            border-top: 1px solid var(--border-subtle);
            padding: 60px 40px;
        }

        .educational-content {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            gap: 60px;
        }

        .edu-section h3 {
            font-family: var(--font-display);
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .edu-section p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .equation-card {
            background-color: var(--bg-surface-elevated);
            border-left: 3px solid var(--accent-cyan);
            border-radius: 0 6px 6px 0;
            padding: 24px;
            margin: 20px 0;
        }

        .equation-raw {
            font-family: var(--font-mono);
            font-size: 1.4rem;
            color: var(--text-primary);
            text-align: center;
            margin-bottom: 16px;
        }

        .equation-variables {
            font-size: 0.8rem;
            color: var(--text-secondary);
            display: flex;
            flex-direction: column;
            gap: 6px;
            border-top: 1px solid var(--border-subtle);
            padding-top: 12px;
        }

        .try-challenge-box {
            background: rgba(155, 77, 255, 0.03);
            border: 1px dashed rgba(155, 77, 255, 0.25);
            border-radius: 6px;
            padding: 28px;
        }

        .try-challenge-box h4 {
            color: #c09bff;
            font-family: var(--font-display);
            margin-bottom: 12px;
            font-size: 1.1rem;
        }

        /* Footer Attribution */
        .creator-signature {
            border-top: 1px solid var(--border-subtle);
            background-color: var(--bg-base);
            padding: 40px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .creator-signature a {
            color: var(--accent-cyan);
            font-weight: 500;
            transition: var(--transition-smooth);
        }

        .creator-signature a:hover {
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        }

        @media (max-width: 1024px) {
            .workspace-grid {
                grid-template-columns: 1fr;
            }
            .canvas-area {
                border-right: none;
                border-bottom: 1px solid var(--border-subtle);
            }
            .educational-content {
                grid-template-columns: 1fr;
                gap: 40px;
            }
            .browser-layout {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="grid-overlay"></div>

    <!-- MAIN HEADER -->
    <header>

    <main id="app-viewport">

    </main>

    <!-- UNIFIED SIGNATURE FOOTER -->
    <div class="creator-signature">
        <p>Built by <a href="https://tawsif-dev.vercel.app" target="_blank" rel="noopener noreferrer">Md Abu Tawsif</a> — exploring the intersection of programming, visualization and science.</p>

    <!-- =========================================================
         APPLICATION CORE & UTILITIES
         ========================================================= -->
    <script>
        /* =========================================================
           SHARED PHYSICS UTILITIES
           ========================================================= */
        const PhysicsUtils = {
            Vector2: class {
                constructor(x = 0, y = 0) {
                    this.x = x;
                    this.y = y;
                }
                set(x, y) { this.x = x; this.y = y; return this; }
                add(v) { this.x += v.x; this.y += v.y; return this; }
                sub(v) { this.x -= v.x; this.y -= v.y; return this; }
                mult(s) { this.x *= s; this.y *= s; return this; }
                mag() { return Math.hypot(this.x, this.y); }
                normalize() {
                    const m = this.mag();
                    if (m > 0) this.mult(1 / m);
                    return this;
                }
                copy() { return new PhysicsUtils.Vector2(this.x, this.y); }
            },

            g: 9.80665,
            k_e: 8.98755e9,
            c: 299792458,
            
            formatValue(val, unit, decimals = 3) {
                if (val === undefined || isNaN(val)) return `---`;
                if (Math.abs(val) > 1e6 || (Math.abs(val) < 1e-4 && val !== 0)) {
                    return `${val.toExponential(decimals)} ${unit}`;
                }
                return `${val.toFixed(decimals)} ${unit}`;
            }
        };

        /* =========================================================
           EXPERIMENT REGISTRY
           ========================================================= */
        const Registry = {
            experiments: new Map(),
            register(experiment) {
                this.experiments.set(experiment.metadata.id, experiment);
            },
            get(id) {
                return this.experiments.get(id);
            },
            getAll() {
                return Array.from(this.experiments.values());
            }
        };

        /* =========================================================
           APPLICATION CORE ENGINE
           ========================================================= */
        const App = {
            state: {
                currentView: 'home',
                activeExperimentId: null,
                searchQuery: '',
                selectedCategory: 'All',
                activeExperiment: null
            },
            heroSimId: null,

            init() {
                this.navigate('home');
                window.addEventListener('popstate', (e) => {
                    if (e.state && e.state.view) {
                        this.navigate(e.state.view, e.state.experimentId, false);
                    }
                });
            },

            navigate(view, experimentId = null, pushState = true) {
                if (this.state.activeExperiment) {
                    this.state.activeExperiment.destroy();
                    this.state.activeExperiment = null;
                }
                if (this.heroSimId) {
                    cancelAnimationFrame(this.heroSimId);
                    this.heroSimId = null;
                }

                this.state.currentView = view;
                this.state.activeExperimentId = experimentId;

                document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
                const navLink = document.getElementById(`nav-${view}`);
                if (navLink) navLink.classList.add('active');

                const viewport = document.getElementById('app-viewport');
                viewport.innerHTML = '';

                if (pushState) {
                    const path = experimentId ? `?view=${view}&id=${experimentId}` : `?view=${view}`;
                    history.pushState({ view, experimentId }, '', path);
                }

                if (view === 'home') {
                    this.renderHome(viewport);
                } else if (view === 'browser') {
                    this.renderBrowser(viewport);
                } else if (view === 'experiment' && experimentId) {
                    this.renderWorkspace(viewport, experimentId);
                }
            },

            renderHome(container) {
                container.innerHTML = `
                    <section class="hero">
                        <div class="hero-canvas-container" id="hero-canvas-host"></div>
                        <div class="hero-pretitle">Interactive Scientific Workspace</div>
                        <h1 class="hero-title">Physics, You Can See.</h1>
                        <p class="hero-description">Explore physical laws through high-precision computational simulations, vector diagnostics, and real-time numerical telemetry.</p>
                        
                        <!-- Creator Spotlight Spotlight Card -->
                        <div class="spotlight-card">
                            <span class="spotlight-badge">Lead Creator Spotlight</span>
                            <h3 class="spotlight-title">Designed by <a href="https://tawsif-dev.vercel.app" target="_blank" rel="noopener noreferrer">Md Abu Tawsif</a></h3>
                            <p style="color: var(--text-secondary); font-size: 0.9rem; line-height: 1.5; margin-bottom: 12px;">
                                Built entirely inside a unified architecture, integrating responsive layouts with low-level differential equation solvers.
                            </p>
                            <button class="btn btn-primary btn-small" onclick="App.navigate('browser')">Explore 150+ Experiments</button>
                        </div>
                    </section>

                    <section class="home-section">
                        <div class="section-header">
                            <div class="section-title-wrapper">
                                <h2>Featured Master Simulations</h2>
                                <p>Begin running analytical systems and adjusting foundational constants</p>
                            </div>
                            <button class="btn" onclick="App.navigate('browser')">View All Systems</button>
                        </div>
                        <div class="experiment-grid" id="featured-experiments"></div>
                    </section>
                `;

                const grid = document.getElementById('featured-experiments');
                Registry.getAll().slice(0, 3).forEach(exp => {
                    grid.appendChild(this.createExperimentCard(exp));
                });

                this.initHeroSimulation();
            },

            renderBrowser(container) {
                container.innerHTML = `
                    <div class="browser-layout">
                        <aside class="browser-sidebar">
                            <div class="sidebar-section">
                                <h3 class="sidebar-title">Categories</h3>
                                <ul class="category-list" id="sidebar-categories">
                                    <li class="category-item active" data-cat="All">
                                        <span>All Disciplines</span>
                                        <span class="category-count">${Registry.getAll().length}</span>
                                    </li>
                                </ul>
                            </div>
                        </aside>
                        <main class="browser-main">
                            <div class="search-bar-container">
                                <div class="search-input-wrapper">
                                    <svg class="search-icon" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                                    <input type="text" class="search-input" id="sim-search" placeholder="Search physical laws, tags, categories..." value="${this.state.searchQuery}">
                                </div>
                            </div>
                            <div class="experiment-grid" id="browser-grid"></div>
                        </main>
                    </div>
                `;

                this.buildSidebarCategories();
                this.filterExperiments();

                document.getElementById('sim-search').addEventListener('input', (e) => {
                    this.state.searchQuery = e.target.value;
                    this.filterExperiments();
                });
            },

            buildSidebarCategories() {
                const sidebar = document.getElementById('sidebar-categories');
                const categories = new Set(Registry.getAll().map(e => e.metadata.category));
                
                categories.forEach(cat => {
                    const count = Registry.getAll().filter(e => e.metadata.category === cat).length;
                    const li = document.createElement('li');
                    li.className = `category-item ${this.state.selectedCategory === cat ? 'active' : ''}`;
                    li.setAttribute('data-cat', cat);
                    li.innerHTML = `
                        <span>${cat}</span>
                        <span class="category-count">${count}</span>
                    `;
                    sidebar.appendChild(li);
                });

                sidebar.querySelectorAll('.category-item').forEach(item => {
                    item.addEventListener('click', () => {
                        sidebar.querySelectorAll('.category-item').forEach(li => li.classList.remove('active'));
                        item.classList.add('active');
                        this.state.selectedCategory = item.getAttribute('data-cat');
                        this.filterExperiments();
                    });
                });
            },

            filterExperiments() {
                const grid = document.getElementById('browser-grid');
                if (!grid) return;
                grid.innerHTML = '';

                const query = this.state.searchQuery.toLowerCase();
                const filtered = Registry.getAll().filter(exp => {
                    const matchesCategory = this.state.selectedCategory === 'All' || exp.metadata.category === this.state.selectedCategory;
                    const matchesSearch = exp.metadata.title.toLowerCase().includes(query) || 
                                          exp.metadata.description.toLowerCase().includes(query) || 
                                          exp.metadata.tags.some(tag => tag.toLowerCase().includes(query));
                    return matchesCategory && matchesSearch;
                });

                if (filtered.length === 0) {
                    grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-secondary); padding: 40px;">No simulations matched your query.</div>`;
                } else {
                    filtered.forEach(exp => {
                        grid.appendChild(this.createExperimentCard(exp));
                    });
                }
            },

            createExperimentCard(exp) {
                const card = document.createElement('div');
                card.className = 'experiment-card';
                card.onclick = () => this.navigate('experiment', exp.metadata.id);
                
                card.innerHTML = `
                    <div>
                        <div class="card-top">
                            <span class="card-meta">${exp.metadata.subcategory}</span>
                            <span class="card-difficulty diff-${exp.metadata.difficulty.toLowerCase()}">${exp.metadata.difficulty}</span>
                        </div>
                        <h3 class="card-title">${exp.metadata.title}</h3>
                        <p class="card-description">${exp.metadata.description}</p>
                    </div>
                    <div class="card-tags">
                        ${exp.metadata.tags.map(tag => `<span class="tag">#${tag}</span>`).join('')}
                    </div>
                `;
                return card;
            },

            renderWorkspace(container, id) {
                const exp = Registry.get(id);
                if (!exp) {
                    container.innerHTML = `<div>Simulation Not Found.</div>`;
                    return;
                }

                this.state.activeExperiment = exp;

                container.innerHTML = `
                    <div class="workspace">
                        <div class="workspace-header">
                            <div>
                                <div class="breadcrumb"><span onclick="App.navigate('browser')">Lab Browser</span> / ${exp.metadata.category}</div>
                                <h1 class="workspace-title">${exp.metadata.title}</h1>
                            </div>
                            <button class="btn" onclick="App.navigate('browser')">Return to Catalog</button>
                        </div>
                        <div class="workspace-grid">
                            <div class="canvas-area">
                                <div class="simulation-canvas-wrapper" id="canvas-wrapper-host">
                                    ${exp.html()}
                                </div>
                            </div>
                            <div class="workspace-sidebar" id="sim-controls-sidebar"></div>
                        </div>
                        <div class="educational-area">
                            <div class="educational-content" id="sim-edu-content"></div>
                        </div>
                    </div>
                `;

                if (exp.css) {
                    let styleTag = document.getElementById('experiment-custom-styles');
                    if (!styleTag) {
                        styleTag = document.createElement('style');
                        styleTag.id = 'experiment-custom-styles';
                        document.head.appendChild(styleTag);
                    }
                    styleTag.textContent = exp.css();
                }

                exp.init(document.getElementById('canvas-wrapper-host'));
            },

            initHeroSimulation() {
                const container = document.getElementById('hero-canvas-host');
                if (!container) return;

                const canvas = document.createElement('canvas');
                canvas.width = container.clientWidth;
                canvas.height = container.clientHeight || 500;
                container.appendChild(canvas);
                const ctx = canvas.getContext('2d');

                const resizeHandler = () => {
                    canvas.width = container.clientWidth;
                    canvas.height = container.clientHeight || 500;
                };
                window.addEventListener('resize', resizeHandler);

                const particles = [];
                for (let i = 0; i < 60; i++) {
                    particles.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        vx: (Math.random() - 0.5) * 1.5,
                        vy: (Math.random() - 0.5) * 1.5,
                        radius: Math.random() * 2 + 1
                    });
                }

                const animate = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = "rgba(0, 240, 255, 0.15)";
                    ctx.strokeStyle = "rgba(0, 240, 255, 0.04)";

                    for (let i = 0; i < particles.length; i++) {
                        const p = particles[i];
                        p.x += p.vx;
                        p.y += p.vy;

                        if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                        if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                        ctx.fill();

                        for (let j = i + 1; j < particles.length; j++) {
                            const p2 = particles[j];
                            const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                            if (dist < 120) {
                                ctx.beginPath();
                                ctx.moveTo(p.x, p.y);
                                ctx.lineTo(p2.x, p2.y);
                                ctx.stroke();
                            }
                        }
                    }

                    this.heroSimId = requestAnimationFrame(animate);
                };

                animate();
            }
        };

        /* =========================================================
           UNIVERSAL PARAMETRIC SOLVER ENGINE
           ========================================================= */
        const UniversalEngine = {
            create(meta, config) {
                return {
                    metadata: meta,
                    html() {
                        return `
                            <canvas class="simulation-canvas" id="canvas-${meta.id}"></canvas>
                            <div class="canvas-toolbar">
                                <button class="toolbar-btn active" id="btn-play-${meta.id}">◀▶</button>
                                <button class="toolbar-btn" id="btn-reset-${meta.id}">↻</button>
                            </div>
                        `;
                    },
                    init(container) {
                        const canvas = document.getElementById(`canvas-${meta.id}`);
                        const ctx = canvas.getContext('2d');
                        
                        const resize = () => {
                            const rect = canvas.parentNode.getBoundingClientRect();
                            canvas.width = rect.width * window.devicePixelRatio;
                            canvas.height = rect.height * window.devicePixelRatio;
                            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
                        };
                        window.addEventListener('resize', resize);
                        resize();

                        const params = { ...config.defaultParams, play: true };
                        let t = 0;

                        // UI Setup
                        const controls = document.getElementById('sim-controls-sidebar');
                        let controlHtml = `<div class="sidebar-panel"><h3 class="sidebar-panel-title">Configuration</h3>`;
                        
                        config.controls.forEach(c => {
                            controlHtml += `
                                <div class="control-group">
                                    <div class="control-label-wrapper">
                                        <span class="control-label">${c.label}</span>
                                        <span class="control-value" id="val-${meta.id}-${c.key}">${params[c.key].toFixed(c.decimals || 1)} ${c.unit || ''}</span>
                                    </div>
                                    <input type="range" class="sim-slider" id="slider-${meta.id}-${c.key}" min="${c.min}" max="${c.max}" step="${c.step}" value="${params[c.key]}">
                                </div>
                            `;
                        });
                        controlHtml += `</div>`;

                        // Add telemetry readouts panel
                        controlHtml += `
                            <div class="sidebar-panel">
                                <h3 class="sidebar-panel-title">Mathematical Metrics</h3>
                                <div class="instrumentation-list" id="telemetry-${meta.id}"></div>
                            </div>
                        `;

                        controls.innerHTML = controlHtml;

                        config.controls.forEach(c => {
                            document.getElementById(`slider-${meta.id}-${c.key}`).addEventListener('input', (e) => {
                                params[c.key] = parseFloat(e.target.value);
                                document.getElementById(`val-${meta.id}-${c.key}`).textContent = params[c.key].toFixed(c.decimals || 1) + ' ' + (c.unit || '');
                                if (config.onParamChange) config.onParamChange(params);
                            });
                        });

                        const edu = document.getElementById('sim-edu-content');
                        edu.innerHTML = `
                            <div class="edu-section">
                                <h3>Theoretical Analysis</h3>
                                <p>${config.explanation}</p>
                                <div class="equation-card">
                                    <div class="equation-raw">${config.equation}</div>
                                </div>
                            </div>
                            <div class="edu-section">
                                <div class="try-challenge-box">
                                    <h4>Scientific Challenge</h4>
                                    <p>${config.challenge}</p>
                                </div>
                            </div>
                        `;

                        const playBtn = document.getElementById(`btn-play-${meta.id}`);
                        playBtn.onclick = () => {
                            params.play = !params.play;
                            playBtn.classList.toggle('active', params.play);
                        };
                        document.getElementById(`btn-reset-${meta.id}`).onclick = () => {
                            t = 0;
                            if (config.reset) config.reset();
                        };

                        let animId;
                        const renderLoop = () => {
                            if (!canvas) return;
                            const w = canvas.width / window.devicePixelRatio;
                            const h = canvas.height / window.devicePixelRatio;
                            
                            if (params.play) t += 0.016;
                            
                            config.solver(ctx, w, h, t, params, document.getElementById(`telemetry-${meta.id}`));
                            animId = requestAnimationFrame(renderLoop);
                        };
                        renderLoop();

                        this.destroy = () => {
                            cancelAnimationFrame(animId);
                            window.removeEventListener('resize', resize);
                        };
                    }
                };
            }
        };

        /* =========================================================
           FLAGSHIP EXPERIMENT 01: PROJECTILE MOTION
           ========================================================= */
        const ProjectileMotion = {
            metadata: {
                id: "projectile-motion",
                title: "Projectile Motion Analysis",
                category: "Mechanics",
                subcategory: "Kinematics",
                description: "Simulate paths of classical mass points under gravitation with real-time trajectory vector tracking.",
                difficulty: "Beginner",
                tags: ["kinematics", "gravity", "trajectory"]
            },
            html() {
                return `
                    <canvas class="simulation-canvas" id="canvas-projectile"></canvas>
                    <div class="canvas-toolbar">
                        <button class="toolbar-btn active" id="btn-play-proj">◀▶</button>
                        <button class="toolbar-btn" id="btn-reset-proj">↻</button>
                    </div>
                `;
            },
            init(container) {
                const canvas = document.getElementById('canvas-projectile');
                const ctx = canvas.getContext('2d');
                
                const resize = () => {
                    const rect = canvas.parentNode.getBoundingClientRect();
                    canvas.width = rect.width * window.devicePixelRatio;
                    canvas.height = rect.height * window.devicePixelRatio;
                    ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
                };
                window.addEventListener('resize', resize);
                resize();

                const params = { v0: 30, theta: 45, h0: 0, g: 9.81, drag: 0.1, play: true };
                let t = 0, path = [], finished = false;

                const getPositionAt = (time) => {
                    const angleRad = (params.theta * Math.PI) / 180;
                    const vx0 = params.v0 * Math.cos(angleRad);
                    const vy0 = params.v0 * Math.sin(angleRad);
                    if (params.drag === 0) {
                        return {
                            x: vx0 * time,
                            y: params.h0 + vy0 * time - 0.5 * params.g * time * time,
                            vx: vx0,
                            vy: vy0 - params.g * time
                        };
                    } else {
                        const k = params.drag;
                        return {
                            x: (vx0 / k) * (1 - Math.exp(-k * time)),
                            y: params.h0 + (1 / k) * (vy0 + params.g / k) * (1 - Math.exp(-k * time)) - (params.g * time) / k,
                            vx: vx0 * Math.exp(-k * time),
                            vy: (vy0 + params.g / k) * Math.exp(-k * time) - params.g / k
                        };
                    }
                };

                const updateControlsPanel = () => {
                    const controls = document.getElementById('sim-controls-sidebar');
                    controls.innerHTML = `
                        <div class="sidebar-panel">
                            <h3 class="sidebar-panel-title">Initial Configuration</h3>
                            <div class="control-group">
                                <div class="control-label-wrapper">
                                    <span class="control-label">Launch Velocity (v₀)</span>
                                    <span class="control-value" id="val-v0">${params.v0} m/s</span>
                                </div>
                                <input type="range" class="sim-slider" id="slider-v0" min="5" max="50" step="1" value="${params.v0}">
                            </div>
                            <div class="control-group">
                                <div class="control-label-wrapper">
                                    <span class="control-label">Launch Angle (θ)</span>
                                    <span class="control-value" id="val-theta">${params.theta}°</span>
                                </div>
                                <input type="range" class="sim-slider" id="slider-theta" min="0" max="90" step="1" value="${params.theta}">
                            </div>
                            <div class="control-group">
                                <div class="control-label-wrapper">
                                    <span class="control-label">Initial Height (h₀)</span>
                                    <span class="control-value" id="val-h0">${params.h0} m</span>
                                </div>
                                <input type="range" class="sim-slider" id="slider-h0" min="0" max="25" step="1" value="${params.h0}">
                            </div>
                            <div class="control-group">
                                <div class="control-label-wrapper">
                                    <span class="control-label">Gravity (g)</span>
                                    <span class="control-value" id="val-g">${params.g} m/s²</span>
                                </div>
                                <input type="range" class="sim-slider" id="slider-g" min="1" max="25" step="0.1" value="${params.g}">
                            </div>
                        </div>
                        <div class="sidebar-panel">
                            <h3 class="sidebar-panel-title">Telemetry Readouts</h3>
                            <div class="instrumentation-list">
                                <div class="instrumentation-item"><span class="instrument-label">Flight Time</span><span class="instrument-value" id="tele-t">0.00 s</span></div>
                                <div class="instrumentation-item"><span class="instrument-label">Horizontal Position (x)</span><span class="instrument-value" id="tele-x">0.00 m</span></div>
                                <div class="instrumentation-item"><span class="instrument-label">Altitude (y)</span><span class="instrument-value" id="tele-y">0.00 m</span></div>
                            </div>
                        </div>
                    `;

                    const bind = (id, key, valId, suffix) => {
                        document.getElementById(id).addEventListener('input', (e) => {
                            params[key] = parseFloat(e.target.value);
                            document.getElementById(valId).textContent = params[key] + suffix;
                            reset();
                        });
                    };
                    bind('slider-v0', 'v0', 'val-v0', ' m/s');
                    bind('slider-theta', 'theta', 'val-theta', '°');
                    bind('slider-h0', 'h0', 'val-h0', ' m');
                    bind('slider-g', 'g', 'val-g', ' m/s²');
                };

                const reset = () => { t = 0; path = []; finished = false; };
                document.getElementById('btn-reset-proj').onclick = reset;
                document.getElementById('btn-play-proj').onclick = () => {
                    params.play = !params.play;
                };

                updateControlsPanel();

                let animId;
                const renderLoop = () => {
                    if (!canvas) return;
                    const w = canvas.width / window.devicePixelRatio;
                    const h = canvas.height / window.devicePixelRatio;
                    ctx.clearRect(0, 0, w, h);

                    if (params.play && !finished) {
                        t += 0.03;
                        const state = getPositionAt(t);
                        if (state.y < 0 && t > 0.1) finished = true;
                        else path.push(state);
                    }

                    const originX = 50, originY = h - 50;
                    ctx.strokeStyle = '#20262d';
                    ctx.beginPath();
                    ctx.moveTo(originX, 0); ctx.lineTo(originX, h);
                    ctx.moveTo(0, originY); ctx.lineTo(w, originY);
                    ctx.stroke();

                    if (path.length > 0) {
                        ctx.strokeStyle = 'var(--accent-cyan)';
                        ctx.beginPath();
                        ctx.moveTo(originX, originY - params.h0 * 5);
                        path.forEach(p => ctx.lineTo(originX + p.x * 5, originY - p.y * 5));
                        ctx.stroke();

                        const cur = path[path.length - 1];
                        ctx.fillStyle = 'var(--accent-orange)';
                        ctx.beginPath();
                        ctx.arc(originX + cur.x * 5, originY - cur.y * 5, 5, 0, Math.PI * 2);
                        ctx.fill();

                        document.getElementById('tele-t').textContent = t.toFixed(2) + ' s';
                        document.getElementById('tele-x').textContent = cur.x.toFixed(2) + ' m';
                        document.getElementById('tele-y').textContent = Math.max(0, cur.y).toFixed(2) + ' m';

                solver: (ctx, w, h, t, params, tele) => {
                    ctx.clearRect(0, 0, w, h);
                    const speed = Math.sqrt(params.temp);
                    
                    ctx.strokeStyle = '#2b3541';
                    ctx.strokeRect(100, 50, w - 200, h - 100);
                    
                    ctx.fillStyle = 'var(--accent-cyan)';
                    for (let i = 0; i < 20; i++) {
                        const x = 110 + (Math.sin(i + t * speed) * 0.5 + 0.5) * (w - 230);
                        const y = 60 + (Math.cos(i*2 + t * speed) * 0.5 + 0.5) * (h - 130);
                        ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fill();
                    }
                    
                    tele.innerHTML = `<div class="instrumentation-item"><span class="instrument-label">Avg Particle Kinetic</span><span class="instrument-value">${(1.5 * 8.314 * params.temp).toFixed(1)} J/mol</span></div>`;
                },
                controls: [
                    { key: "temp", label: "Temperature", min: 100, max: 1000, step: 50, decimals: 0, unit: "K" }
                ],
                defaultParams: { temp: 300 }
            },
            {
                category: "Quantum Physics",
                subcategory: "Quantum Physics",
                topics: ["Quantum Wave Packet", "Particle in a Box", "Quantum Tunneling", "Infinite Potential Well", "Finite Potential Well", "Harmonic Oscillator", "Double-Well Potential", "Heisenberg Uncertainty", "Probability Density", "Quantum Superposition", "Spin Measurement", "Stern-Gerlach Experiment"],
                equation: "i\\hbar\\frac{\\partial}{\\partial t}\\Psi = \\hat{H}\\Psi",
                explanation: "Analyze spatial probability densities of subatomic particles trapped inside infinite structural potential wells.",
                challenge: "Set energy quantum number to higher values. Map the node formations across the spatial domain.",
                solver: (ctx, w, h, t, params, tele) => {
                    ctx.clearRect(0, 0, w, h);
                    ctx.strokeStyle = 'var(--accent-violet)';
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    for (let x = 100; x < w - 100; x++) {
                        const psi = Math.sin((params.state * Math.PI * (x - 100)) / (w - 200));
                        const y = h/2 + psi * Math.sin(t * params.state) * 60;
                        if (x === 100) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                    }
                    ctx.stroke();
                    tele.innerHTML = `<div class="instrumentation-item"><span class="instrument-label">Energy State (n)</span><span class="instrument-value">${params.state.toFixed(0)}</span></div>`;
                },
                controls: [
                    { key: "state", label: "Quantum State (n)", min: 1, max: 6, step: 1, decimals: 0 }
                ],
                defaultParams: { state: 1 }
            },
            {
                category: "Relativity",
                subcategory: "Relativity",
                topics: ["Time Dilation", "Length Contraction", "Relativistic Velocity Addition", "Relativistic Doppler Effect", "Twin Paradox Visualization", "Spacetime Diagram", "Light Cone", "Gravitational Time Dilation"],
                equation: "\\gamma = \\frac{1}{\\sqrt{1 - v^2/c^2}}",
                explanation: "Model spatial relativistic coordinate transformation matrices between observer boundaries.",
                challenge: "Increase velocity boundary levels toward speed of light (c) and observe lorentz factor exponential curves.",
                solver: (ctx, w, h, t, params, tele) => {
                    ctx.clearRect(0, 0, w, h);
                    const gamma = 1 / Math.sqrt(1 - Math.pow(params.speed, 2));
                    
                    ctx.strokeStyle = '#2b3541';
                    ctx.strokeRect(100, h/2 - 20, w - 200, 40);
                    
                    ctx.fillStyle = 'var(--accent-cyan)';
                    ctx.fillRect(100, h/2 - 15, (w - 200) / gamma, 30);
                    
                    tele.innerHTML = `
                        <div class="instrumentation-item"><span class="instrument-label">Lorentz Factor</span><span class="instrument-value">${gamma.toFixed(4)}</span></div>
                        <div class="instrumentation-item"><span class="instrument-label">Spatial Contraction</span><span class="instrument-value">${(100/gamma).toFixed(2)} %</span></div>
                    `;
                },
                controls: [
                    { key: "speed", label: "Relative Speed (v/c)", min: 0, max: 0.99, step: 0.01, decimals: 2 }
                ],
                defaultParams: { speed: 0.5 }
            },
            {
                category: "Astrophysics",
                subcategory: "Astrophysics",
                topics: ["Stellar Orbits", "Star Classification", "Hertzsprung–Russell Diagram", "Stellar Luminosity", "Planetary Orbits", "Solar System Gravity", "Exoplanet Transit", "Gravitational Lensing", "Black Hole Escape Velocity", "Schwarzschild Radius", "Accretion Disk Visualization", "Binary Star Dynamics"],
                equation: "R_s = \\frac{2GM}{c^2}",
                explanation: "Simulate gravity wells of Schwarzschild black holes. Compute light ray path deflection metrics.",
                challenge: "Vary singularity mass and monitor changes in coordinate event horizon dimensions.",
                solver: (ctx, w, h, t, params, tele) => {
                    ctx.clearRect(0, 0, w, h);
                    const rs = params.mass * 12;
                    
                    ctx.fillStyle = '#000';
                    ctx.beginPath(); ctx.arc(w/2, h/2, rs, 0, Math.PI * 2); ctx.fill();
                    ctx.strokeStyle = 'var(--accent-orange)';
                    ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.arc(w/2, h/2, rs * 2.5, 0, Math.PI * 2); ctx.stroke();
                    
                    tele.innerHTML = `<div class="instrumentation-item"><span class="instrument-label">Radius (Rs)</span><span class="instrument-value">${(params.mass * 2.95).toFixed(2)} km</span></div>`;
                },
                controls: [
                    { key: "mass", label: "BH Mass (M☉)", min: 1, max: 10, step: 0.5, decimals: 1 }
                ],
                defaultParams: { mass: 3 }
            }
        ];

        // Programmatically register the massive list of other experiments
        systemCategories.forEach(cat => {
            cat.topics.forEach(topic => {
                const topicId = topic.toLowerCase().replace(/[^a-z0-9]+/g, '-');
                Registry.register(UniversalEngine.create({
                    id: topicId,
                    title: topic,
                    category: cat.category,
                    subcategory: cat.subcategory,
                    description: `Explore the dynamic principles and variables behind the physics of ${topic}.`,
                    difficulty: "Intermediate",
                    tags: [cat.subcategory.toLowerCase().replace(/\s+/g, '-'), "interactive-simulation"]
                }, cat));
            });
        });

        // Initialize App on DOM load
        window.addEventListener('DOMContentLoaded', () => {
            App.init();
        });
    </script>
</body>
</html>
