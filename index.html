<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Simulation Laboratory — Md Abu Tawsif</title>
    <!-- Technical & Editorial Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* =========================================================
           GLOBAL THEME & CONSOLE STYLING
           ========================================================= */
        :root {
            --bg-base: #0a0c0e;
            --bg-surface: #111418;
            --bg-surface-elevated: #161b22;
            --border-subtle: #21262d;
            --border-accent: #30363d;
            
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --text-muted: #58a6ff;
            
            --accent-cyan: #00f0ff;
            --accent-violet: #8a2be2;
            --accent-orange: #ff7f50;
            --accent-red: #f85149;
            --accent-green: #3fb950;
            --accent-yellow: #d29922;
            
            --font-ui: 'Inter', system-ui, sans-serif;
            --font-display: 'Space Grotesk', sans-serif;
            --font-mono: 'Fira Code', 'JetBrains Mono', monospace;
            
            --transition-tactile: 0.15s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: var(--font-ui);
            line-height: 1.5;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* Tactical CRT Scanlines & Grid Overlay */
        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.008) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.008) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 1;
        }

        .crt-scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 999;
            opacity: 0.15;
        }

        /* Custom technical scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-base);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-subtle);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--border-accent);
        }

        /* Layout Framework */
        header {
            position: sticky;
            top: 0;
            width: 100%;
            height: 70px;
            background-color: rgba(10, 12, 14, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            z-index: 100;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .logo-symbol {
            width: 18px;
            height: 18px;
            border: 2px solid var(--accent-cyan);
            border-radius: 50%;
            position: relative;
        }

        .logo-symbol::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 6px;
            height: 6px;
            background: var(--accent-cyan);
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        .logo-text {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .logo-text span {
            color: var(--accent-cyan);
            font-weight: 300;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 32px;
        }

        nav a {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            transition: var(--transition-tactile);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
        }

        nav a:hover, nav a.active {
            color: var(--accent-cyan);
        }

        .nav-status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: rgba(0, 240, 255, 0.04);
            border: 1px solid rgba(0, 240, 255, 0.15);
            border-radius: 4px;
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--accent-cyan);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: var(--accent-cyan);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-cyan);
            animation: pulse-dot 1.8s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        main {
            position: relative;
            z-index: 10;
        }

        /* Lab Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 22px;
            background: var(--bg-surface-elevated);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            font-family: var(--font-ui);
            font-size: 0.85rem;
            font-weight: 500;
            border-radius: 4px;
            cursor: pointer;
            transition: var(--transition-tactile);
        }

        .btn:hover {
            border-color: var(--accent-cyan);
            background: rgba(0, 240, 255, 0.02);
        }

        .btn-primary {
            background: var(--accent-cyan);
            color: var(--bg-base);
            border: 1px solid var(--accent-cyan);
            font-weight: 600;
        }

        .btn-primary:hover {
            background: #00d2e0;
            border-color: #00d2e0;
            color: var(--bg-base);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }

        /* =========================================================
           HOME VIEW STYLES
           ========================================================= */
        .hero {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 140px 20px 80px 20px;
            overflow: hidden;
        }

        .hero-canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.25;
            pointer-events: none;
        }

        .hero-pretitle {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--accent-cyan);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .hero-title {
            font-family: var(--font-display);
            font-size: clamp(3rem, 7vw, 5.2rem);
            font-weight: 700;
            line-height: 1.05;
            letter-spacing: -2px;
            margin-bottom: 24px;
            background: linear-gradient(135deg, #fff 50%, var(--text-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-description {
            max-width: 680px;
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: 40px;
            font-weight: 300;
        }

        /* Chief Architect Feature Block */
        .portfolio-block {
            background: linear-gradient(135deg, var(--bg-surface), #13171e);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 40px;
            max-width: 900px;
            margin: 0 auto 80px auto;
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 40px;
            text-align: left;
            position: relative;
        }

        .portfolio-badge {
            position: absolute;
            top: -12px;
            left: 32px;
            background: var(--accent-cyan);
            color: var(--bg-base);
            font-family: var(--font-mono);
            font-size: 0.7rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .portfolio-title {
            font-family: var(--font-display);
            font-size: 1.6rem;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .portfolio-title a {
            color: var(--accent-cyan);
            text-decoration: underline;
            text-underline-offset: 4px;
            transition: var(--transition-tactile);
        }

        .portfolio-title a:hover {
            color: #00d2e0;
        }

        .portfolio-text {
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .notebook-panel {
            background-color: rgba(6, 8, 10, 0.4);
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            padding: 20px;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--text-secondary);
            border-left: 3px solid var(--accent-orange);
        }

        .notebook-title {
            color: var(--accent-orange);
            font-weight: 700;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .home-section {
            padding: 40px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .section-header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            margin-bottom: 40px;
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: 16px;
        }

        .section-title-wrapper h2 {
            font-family: var(--font-display);
            font-size: 2rem;
            font-weight: 600;
        }

        .section-title-wrapper p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-top: 4px;
        }

        /* =========================================================
           LAB CATALOG BROWSER
           ========================================================= */
        .browser-layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            min-height: calc(100vh - 70px);
            max-width: 100%;
        }

        .browser-sidebar {
            border-right: 1px solid var(--border-subtle);
            padding: 32px;
            background-color: rgba(14, 17, 21, 0.4);
            overflow-y: auto;
            max-height: calc(100vh - 70px);
        }

        .sidebar-section {
            margin-bottom: 32px;
        }

        .sidebar-title {
            font-family: var(--font-display);
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .category-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .category-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            border-radius: 4px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition-tactile);
        }

        .category-item:hover, .category-item.active {
            background-color: var(--bg-surface-elevated);
            color: var(--text-primary);
        }

        .category-item.active {
            border-left: 2px solid var(--accent-cyan);
            padding-left: 12px;
        }

        .category-count {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            background-color: rgba(255, 255, 255, 0.04);
            padding: 2px 6px;
            border-radius: 3px;
            color: var(--text-muted);
        }

        .browser-main {
            padding: 40px;
            overflow-y: auto;
            max-height: calc(100vh - 70px);
        }

        .search-bar-container {
            display: flex;
            gap: 16px;
            margin-bottom: 40px;
        }

        .search-input-wrapper {
            position: relative;
            flex: 1;
        }

        .search-input {
            width: 100%;
            height: 52px;
            background-color: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            padding: 0 16px 0 54px;
            color: var(--text-primary);
            font-family: var(--font-ui);
            font-size: 1rem;
            transition: var(--transition-tactile);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent-cyan);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.08);
        }

        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        /* Scientific Cards */
        .experiment-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .experiment-card {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: var(--transition-tactile);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            min-height: 220px;
        }

        .experiment-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-violet));
            opacity: 0;
            transition: var(--transition-tactile);
        }

        .experiment-card:hover {
            transform: translateY(-4px);
            border-color: var(--border-accent);
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.5);
        }

        .experiment-card:hover::before {
            opacity: 1;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 14px;
        }

        .card-meta {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--accent-cyan);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card-difficulty {
            font-size: 0.65rem;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .diff-beginner { background: rgba(0, 240, 255, 0.08); color: var(--accent-cyan); }
        .diff-intermediate { background: rgba(255, 107, 53, 0.08); color: var(--accent-orange); }
        .diff-advanced { background: rgba(155, 77, 255, 0.08); color: #b780ff; }

        .card-title {
            font-family: var(--font-display);
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .card-description {
            color: var(--text-secondary);
            font-size: 0.85rem;
            line-height: 1.45;
            margin-bottom: 20px;
            flex-grow: 1;
        }

        .card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: auto;
        }

        .tag {
            font-family: var(--font-mono);
            font-size: 0.65rem;
            background-color: var(--bg-surface-elevated);
            color: var(--text-secondary);
            padding: 3px 8px;
            border-radius: 3px;
        }

        /* =========================================================
           EXPERIMENT WORKSPACE LAYOUT
           ========================================================= */
        .workspace {
            display: flex;
            flex-direction: column;
            min-height: calc(100vh - 70px);
            background-color: var(--bg-base);
        }

        .workspace-header {
            border-bottom: 1px solid var(--border-subtle);
            padding: 24px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--bg-surface);
        }

        .breadcrumb {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .breadcrumb span {
            color: var(--accent-cyan);
            cursor: pointer;
        }

        .workspace-title {
            font-family: var(--font-display);
            font-size: 1.6rem;
            font-weight: 600;
        }

        .workspace-grid {
            display: grid;
            grid-template-columns: 1fr 360px;
            flex-grow: 1;
            min-height: 520px;
        }

        .canvas-area {
            position: relative;
            background-color: #080a0d;
            display: flex;
            align-items: center;
            justify-content: center;
            border-right: 1px solid var(--border-subtle);
            padding: 30px;
            overflow: hidden;
        }

        .simulation-canvas-wrapper {
            position: relative;
            width: 100%;
            max-width: 860px;
            aspect-ratio: 16/10;
            background-color: #040507;
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            overflow: hidden;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.8);
        }

        .simulation-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .canvas-toolbar {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(14, 17, 21, 0.95);
            border: 1px solid var(--border-accent);
            border-radius: 6px;
            display: flex;
            padding: 6px;
            gap: 6px;
            backdrop-filter: blur(8px);
            z-index: 20;
        }

        .toolbar-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            width: 36px;
            height: 36px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition-tactile);
            font-size: 1.1rem;
        }

        .toolbar-btn:hover {
            color: var(--accent-cyan);
            background-color: rgba(255, 255, 255, 0.05);
        }

        .toolbar-btn.active {
            color: var(--bg-base);
            background-color: var(--accent-cyan);
        }

        /* Controls sidebar */
        .workspace-sidebar {
            display: flex;
            flex-direction: column;
            background-color: var(--bg-surface);
            overflow-y: auto;
            max-height: calc(100vh - 150px);
        }

        .sidebar-panel {
            padding: 24px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .sidebar-panel-title {
            font-family: var(--font-display);
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-secondary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-label-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px;
            font-size: 0.8rem;
        }

        .control-label {
            color: var(--text-secondary);
            font-weight: 500;
        }

        .control-value {
            font-family: var(--font-mono);
            color: var(--accent-cyan);
        }

        .sim-slider {
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            height: 4px;
            border-radius: 2px;
            background: var(--border-subtle);
            outline: none;
            transition: var(--transition-tactile);
        }

        .sim-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent-cyan);
            cursor: pointer;
            border: 2px solid var(--bg-surface);
            box-shadow: 0 0 10px var(--accent-cyan-glow);
        }

        /* Instrumentation list */
        .instrumentation-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .instrumentation-item {
            background-color: var(--bg-surface-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: 4px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .instrument-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
        }

        .instrument-value {
            font-family: var(--font-mono);
            font-size: 0.95rem;
            color: var(--accent-cyan);
            font-weight: 500;
        }

        /* Educational Section */
        .educational-area {
            background-color: var(--bg-surface);
            border-top: 1px solid var(--border-subtle);
            padding: 60px 40px;
        }

        .educational-content {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            gap: 60px;
        }

        .edu-section h3 {
            font-family: var(--font-display);
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .edu-section p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .equation-card {
            background-color: var(--bg-surface-elevated);
            border-left: 3px solid var(--accent-cyan);
            border-radius: 0 6px 6px 0;
            padding: 24px;
            margin: 20px 0;
        }

        .equation-raw {
            font-family: var(--font-mono);
            font-size: 1.4rem;
            color: var(--text-primary);
            text-align: center;
            margin-bottom: 16px;
        }

        .equation-variables {
            font-size: 0.8rem;
            color: var(--text-secondary);
            display: flex;
            flex-direction: column;
            gap: 6px;
            border-top: 1px solid var(--border-subtle);
            padding-top: 12px;
        }

        .try-challenge-box {
            background: rgba(155, 77, 255, 0.03);
            border: 1px dashed rgba(155, 77, 255, 0.25);
            border-radius: 6px;
            padding: 28px;
        }

        .try-challenge-box h4 {
            color: #c09bff;
            font-family: var(--font-display);
            margin-bottom: 12px;
            font-size: 1.1rem;
        }

        /* Footer Attribution */
        .creator-signature {
            border-top: 1px solid var(--border-subtle);
            background-color: var(--bg-base);
            padding: 40px;
            text-align: center;

</head>
<body>

            </div>
        </nav>
    </header>

    <!-- CONTENT VIEWPORT -->
    <main id="app-viewport">
        <!-- Viewport contents loaded dynamically -->
    </main>

    <!-- UNIFIED SIGNATURE FOOTER -->
    <div class="creator-signature">
        <p>Built by <a href="https://tawsif-dev.vercel.app" target="_blank" rel="noopener noreferrer">Md Abu Tawsif</a> — exploring the intersection of programming, visualization and science.</p>
    </div>

    <!-- =========================================================
         APPLICATION CORE & UTILITIES
         ========================================================= -->
    <script>
        /* =========================================================
           SHARED PHYSICS UTILITIES
           ========================================================= */
        const PhysicsUtils = {
            Vector2: class {
                constructor(x = 0, y = 0) {
                    this.x = x;
                    this.y = y;
                }
                set(x, y) { this.x = x; this.y = y; return this; }
                add(v) { this.x += v.x; this.y += v.y; return this; }
                sub(v) { this.x -= v.x; this.y -= v.y; return this; }
                mult(s) { this.x *= s; this.y *= s; return this; }
                mag() { return Math.hypot(this.x, this.y); }
                normalize() {
                    const m = this.mag();
                    if (m > 0) this.mult(1 / m);
                    return this;
                }
                copy() { return new PhysicsUtils.Vector2(this.x, this.y); }
            },

            g: 9.80665,
            k_e: 8.98755e9,
            c: 299792458,
            
            formatValue(val, unit, decimals = 3) {
                if (val === undefined || isNaN(val)) return `---`;
                if (Math.abs(val) > 1e6 || (Math.abs(val) < 1e-4 && val !== 0)) {
                    return `${val.toExponential(decimals)} ${unit}`;
                }
                return `${val.toFixed(decimals)} ${unit}`;
            },

            // Drawing high-fidelity physical springs procedurally
            drawSpring(ctx, x1, y1, x2, y2, coils = 14, width = 12) {
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                
                const dx = x2 - x1;
                const dy = y2 - y1;
                const len = Math.hypot(dx, dy);
                const ux = dx / len;
                const uy = dy / len;
                const nx = -uy;
                const ny = ux;
                
                const leadIn = 20;
                const leadOut = 20;
                const springLen = len - leadIn - leadOut;
                
                ctx.lineTo(x1 + ux * leadIn, y1 + uy * leadIn);
                
                for (let i = 0; i <= coils; i++) {
                    const t = i / coils;
                    const dist = leadIn + t * springLen;
                    const disp = (i === 0 || i === coils) ? 0 : (i % 2 === 0 ? 1 : -1) * width;
                    const cx = x1 + ux * dist + nx * disp;
                    const cy = y1 + uy * dist + ny * disp;
                    ctx.lineTo(cx, cy);
                }
                ctx.lineTo(x2, y2);
                ctx.strokeStyle = '#a5b4fc';
                ctx.lineWidth = 2;
                ctx.stroke();
            },

            // Drawing high-fidelity glass optical lenses procedurally
            drawLens(ctx, x, y, height = 120, width = 24, isConcave = false) {
                ctx.beginPath();
                if (!isConcave) {
                    ctx.moveTo(x, y - height / 2);
                    ctx.quadraticCurveTo(x + width, y, x, y + height / 2);
                    ctx.quadraticCurveTo(x - width, y, x, y - height / 2);
                } else {
                    ctx.moveTo(x - width / 2, y - height / 2);
                    ctx.lineTo(x + width / 2, y - height / 2);
                    ctx.quadraticCurveTo(x + 4, y, x + width / 2, y + height / 2);
                    ctx.lineTo(x - width / 2, y + height / 2);
                    ctx.quadraticCurveTo(x - 4, y, x - width / 2, y - height / 2);
                }
                
                const grad = ctx.createLinearGradient(x - width, y, x + width, y);
                grad.addColorStop(0, 'rgba(0, 240, 255, 0.08)');
                grad.addColorStop(0.5, 'rgba(255, 255, 255, 0.2)');
                grad.addColorStop(1, 'rgba(0, 240, 255, 0.08)');
                ctx.fillStyle = grad;
                ctx.fill();
                
                ctx.strokeStyle = 'rgba(0, 240, 255, 0.45)';
                ctx.lineWidth = 1.5;
                ctx.stroke();
            }
        };

        /* =========================================================
           EXPERIMENT REGISTRY
           ========================================================= */
        const Registry = {
            experiments: new Map(),
            register(experiment) {
                this.experiments.set(experiment.metadata.id, experiment);
            },
            get(id) {
                return this.experiments.get(id);
            },
            getAll() {
                return Array.from(this.experiments.values());
            }
        };

        /* =========================================================
           FLAGSHIP EXPERIMENT 01: PROJECTILE MOTION
           ========================================================= */
        const ProjectileMotion = {
            metadata: {
                id: "projectile-motion",
                title: "Projectile Motion Analysis",
                category: "Mechanics",
                subcategory: "Kinematics",
                description: "Compute trajectories under variable local gravitational force and Stokes drag vectors.",
                difficulty: "Beginner",
                tags: ["kinematics", "gravity", "trajectory"]
            },
            html() {
                return `
                    <canvas class="simulation-canvas" id="canvas-projectile"></canvas>
                    <div class="canvas-toolbar">
                        <button class="toolbar-btn active" id="btn-play-proj">◀▶</button>
                        <button class="toolbar-btn" id="btn-reset-proj">↻</button>
                    </div>
                `;
            },
            init(container) {
                const canvas = document.getElementById('canvas-projectile');
                const ctx = canvas.getContext('2d');
                
                const resize = () => {
                    const rect = canvas.parentNode.getBoundingClientRect();
                    canvas.width = rect.width * window.devicePixelRatio;
                    canvas.height = rect.height * window.devicePixelRatio;
                    ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
                };
                window.addEventListener('resize', resize);
                resize();

                const params = { v0: 30, theta: 45, h0: 5, g: 9.81, drag: 0.15, play: true };
                let t = 0, path = [], finished = false;

                const getPositionAt = (time) => {
                    const angleRad = (params.theta * Math.PI) / 180;
                    const vx0 = params.v0 * Math.cos(angleRad);
                    const vy0 = params.v0 * Math.sin(angleRad);
                    if (params.drag === 0) {
                        return {
                            x: vx0 * time,
                            y: params.h0 + vy0 * time - 0.5 * params.g * time * time,
                            vx: vx0,
                            vy: vy0 - params.g * time
                        };
                    } else {
                        const k = params.drag;
                        return {
                            x: (vx0 / k) * (1 - Math.exp(-k * time)),
                            y: params.h0 + (1 / k) * (vy0 + params.g / k) * (1 - Math.exp(-k * time)) - (params.g * time) / k,
                            vx: vx0 * Math.exp(-k * time),
                            vy: (vy0 + params.g / k) * Math.exp(-k * time) - params.g / k
                        };
                    }
                };

                const updateControlsPanel = () => {
                    const controls = document.getElementById('sim-controls-sidebar');
                    controls.innerHTML = `
                        <div class="sidebar-panel">
                            <h3 class="sidebar-panel-title">Initial Configuration</h3>
                            <div class="control-group">
                                <div class="control-label-wrapper">
                                    <span class="control-label">Launch Velocity (v₀)</span>
                                    <span class="control-value" id="val-v0">${params.v0} m/s</span>
                                </div>
                                <input type="range" class="sim-slider" id="slider-v0" min="10" max="50" step="1" value="${params.v0}">
                            </div>
                            <div class="control-group">
                                <div class="control-label-wrapper">
                                    <span class="control-label">Launch Angle (θ)</span>
                                    <span class="control-value" id="val-theta">${params.theta}°</span>
                                </div>
                                <input type="range" class="sim-slider" id="slider-theta" min="0" max="90" step="1" value="${params.theta}">
                            </div>
                            <div class="control-group">
                                <div class="control-label-wrapper">
                                    <span class="control-label">Initial Height (h₀)</span>
                                    <span class="control-value" id="val-h0">${params.h0} m</span>
                                </div>
                                <input type="range" class="sim-slider" id="slider-h0" min="0" max="25" step="1" value="${params.h0}">
                            </div>
                            <div class="control-group">
                                <div class="control-label-wrapper">
                                    <span class="control-label">Air Resistance (b)</span>
                                    <span class="control-value" id="val-drag">${params.drag.toFixed(2)}</span>
                                </div>
                                <input type="range" class="sim-slider" id="slider-drag" min="0" max="0.5" step="0.01" value="${params.drag}">
                            </div>
                        </div>
                        <div class="sidebar-panel">
                            <h3 class="sidebar-panel-title">Telemetry Readouts</h3>
                            <div class="instrumentation-list">
                                <div class="instrumentation-item"><span class="instrument-label">Flight Time</span><span class="instrument-value" id="tele-t">0.00 s</span></div>
                                <div class="instrumentation-item"><span class="instrument-label">Horizontal Position (x)</span><span class="instrument-value" id="tele-x">0.00 m</span></div>
                                <div class="instrumentation-item"><span class="instrument-label">Altitude (y)</span><span class="instrument-value" id="tele-y">0.00 m</span></div>
                            </div>
                        </div>
                    `;

                    const bind = (id, key, valId, suffix, isFixed = false) => {
                        document.getElementById(id).addEventListener('input', (e) => {
                            params[key] = parseFloat(e.target.value);
                            document.getElementById(valId).textContent = isFixed ? params[key].toFixed(2) + suffix : params[key] + suffix;
                            reset();
                        });
                    };
                    bind('slider-v0', 'v0', 'val-v0', ' m/s');
                    bind('slider-theta', 'theta', 'val-theta', '°');
                    bind('slider-h0', 'h0', 'val-h0', ' m');
                    bind('slider-drag', 'drag', 'val-drag', '', true);
                };

                const reset = () => { t = 0; path = []; finished = false; };
                document.getElementById('btn-reset-proj').onclick = reset;
                document.getElementById('btn-play-proj').onclick = (e) => {
                    params.play = !params.play;
                    e.currentTarget.classList.toggle('active', params.play);
                };

                updateControlsPanel();

                const edu = document.getElementById('sim-edu-content');
                edu.innerHTML = `
                    <div class="edu-section">
                        <h3>Equations of Motion with Air Drag</h3>
                        <p>When accounting for a drag force directly proportional to velocity ($F_d = -bv$), the system is described by decoupled differential equations:</p>
                        <div class="equation-card">
                            <div class="equation-raw">m\\frac{d\\vec{v}}{dt} = m\\vec{g} - b\\vec{v}</div>
                        </div>
                    </div>
                `;

                let animId;
                const renderLoop = () => {
                    if (!canvas) return;
                    const w = canvas.width / window.devicePixelRatio;
                    const h = canvas.height / window.devicePixelRatio;
                    ctx.clearRect(0, 0, w, h);

                    const scale = 5.5; 
                    const originX = 60;
                    const originY = h - 60;

                    ctx.strokeStyle = '#1d232a';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    for (let lx = originX; lx < w; lx += 40) {
                        ctx.moveTo(lx, 0); ctx.lineTo(lx, originY);
                    }
                    for (let ly = originY; ly > 0; ly -= 40) {
                        ctx.moveTo(originX, ly); ctx.lineTo(w, ly);
                    }
                    ctx.stroke();

                    ctx.strokeStyle = '#30363d';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(originX, originY);
                    ctx.lineTo(w, originY);
                    ctx.stroke();

                    ctx.fillStyle = '#8b949e';
                    ctx.font = '8px monospace';
                    for (let lx = originX; lx < w; lx += 80) {
                        const meters = ((lx - originX) / scale).toFixed(0);
                        ctx.fillText(`${meters}m`, lx - 8, originY + 16);
                    }

                    if (params.play && !finished) {
                        t += 0.025;
                        const state = getPositionAt(t);
                        if (state.y < 0 && t > 0.1) {
                            finished = true;
                        } else {
                            path.push(state);
                        }
                    }

                    if (path.length > 0) {
                        ctx.strokeStyle = 'rgba(0, 240, 255, 0.45)';
                        ctx.lineWidth = 1.5;
                        ctx.beginPath();
                        ctx.moveTo(originX, originY - params.h0 * scale);
                        path.forEach(p => ctx.lineTo(originX + p.x * scale, originY - p.y * scale));
                        ctx.stroke();

                        const cur = path[path.length - 1];
                        const projX = originX + cur.x * scale;
                        const projY = originY - cur.y * scale;

                        ctx.fillStyle = 'var(--accent-orange)';
                        ctx.beginPath();
                        ctx.arc(projX, projY, 5, 0, Math.PI * 2);
                        ctx.fill();

                        ctx.strokeStyle = 'var(--accent-cyan)';
                        ctx.lineWidth = 1.5;
                        ctx.beginPath();
                        ctx.moveTo(projX, projY);
                        ctx.lineTo(projX + cur.vx * 1.5, projY - cur.vy * 1.5);
                        ctx.stroke();

                        ctx.strokeStyle = 'var(--accent-red)';
                        ctx.beginPath();
                        ctx.moveTo(projX, projY);
                        ctx.lineTo(projX, projY + params.g * 1.5);
                        ctx.stroke();

                        document.getElementById('tele-t').textContent = t.toFixed(2) + ' s';
                        document.getElementById('tele-x').textContent = cur.x.toFixed(2) + ' m';
                        document.getElementById('tele-y').textContent = Math.max(0, cur.y).toFixed(2) + ' m';
                    }

                    ctx.save();
                    ctx.translate(originX, originY - params.h0 * scale);
                    ctx.rotate(-params.theta * Math.PI / 180);
                    ctx.strokeStyle = '#8b949e';
                    ctx.lineWidth = 6;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(24, 0);
                    ctx.stroke();
                    ctx.restore();

                    ctx.fillStyle = '#21262d';
                    ctx.beginPath();
                    ctx.arc(originX, originY - params.h0 * scale, 8, 0, Math.PI * 2);
                    ctx.fill();

                    animId = requestAnimationFrame(renderLoop);
                };
                renderLoop();

                this.destroy = () => {
                    cancelAnimationFrame(animId);
                    window.removeEventListener('resize', resize);
                };
            }
        };
        Registry.register(ProjectileMotion);

        /* =========================================================
           FLAGSHIP EXPERIMENT 02: SIMPLE PENDULUM
           ========================================================= */
        const SimplePendulum = {
            metadata: {
                id: "simple-pendulum",
                title: "Harmonic Pendulum Dynamics",
                category: "Mechanics",
                subcategory: "Oscillations",
                description: "Observe dynamic harmonic phase coordinates calculated via multi-step Runge-Kutta numerical integration.",
                difficulty: "Intermediate",
                tags: ["oscillations", "harmonic", "gravity"]
            },
            html() {
                return `
                    <canvas class="simulation-canvas" id="canvas-pendulum"></canvas>
                    <div class="canvas-toolbar">
                        <button class="toolbar-btn active" id="btn-play-pend">◀▶</button>
                        <button class="toolbar-btn" id="btn-reset-pend">↻</button>
                    </div>
                `;
            },
            init(container) {
                const canvas = document.getElementById('canvas-pendulum');
                const ctx = canvas.getContext('2d');
                
                const resize = () => {
                    const rect = canvas.parentNode.getBoundingClientRect();
                    canvas.width = rect.width * window.devicePixelRatio;
                    canvas.height = rect.height * window.devicePixelRatio;
                    ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
                };
                window.addEventListener('resize', resize);
                resize();

                const params = { L: 6, m: 3, theta0: 45, g: 9.81, damping: 0.05, play: true };
                let theta = (params.theta0 * Math.PI) / 180, omega = 0;
                let phasePath = [];

                const updateControlsPanel = () => {
                    const controls = document.getElementById('sim-controls-sidebar');
                    controls.innerHTML = `
                        <div class="sidebar-panel">
                            <h3 class="sidebar-panel-title">System Settings</h3>
                            <div class="control-group">
                                <div class="control-label-wrapper">
                                    <span class="control-label">Length (L)</span>
                                    <span class="control-value" id="val-L">${params.L} m</span>
                                </div>
                                <input type="range" class="sim-slider" id="slider-L" min="2" max="10" step="0.5" value="${params.L}">
                            </div>
                            <div class="control-group">
                                <div class="control-label-wrapper">
                                    <span class="control-label">Deflection Angle (θ₀)</span>
                                    <span class="control-value" id="val-th0">${params.theta0}°</span>
                                </div>
                                <input type="range" class="sim-slider" id="slider-th0" min="-90" max="90" step="5" value="${params.theta0}">
                            </div>
                            <div class="control-group">
                                <div class="control-label-wrapper">
                                    <span class="control-label">Mass (m)</span>
                                    <span class="control-value" id="val-mass">${params.m} kg</span>
                                </div>
                                <input type="range" class="sim-slider" id="slider-mass" min="1" max="8" step="0.5" value="${params.m}">
                            </div>
                        </div>
                    `;
                    document.getElementById('slider-L').addEventListener('input', (e) => {
                        params.L = parseFloat(e.target.value);
                        document.getElementById('val-L').textContent = params.L + ' m';
                    });
                    document.getElementById('slider-mass').addEventListener('input', (e) => {
                        params.m = parseFloat(e.target.value);
                        document.getElementById('val-mass').textContent = params.m + ' kg';
                    });
                    document.getElementById('slider-th0').addEventListener('input', (e) => {
                        params.theta0 = parseFloat(e.target.value);
                        document.getElementById('val-th0').textContent = params.theta0 + '°';
                        theta = (params.theta0 * Math.PI) / 180; omega = 0;
                        phasePath = [];
                    });
                };

                updateControlsPanel();

                const edu = document.getElementById('sim-edu-content');
                edu.innerHTML = `
                    <div class="edu-section">
                        <h3>Equations of Oscillatory Motion</h3>
                        <p>Calculated numerically using Runge-Kutta numerical approximation, resolving angular displacement and velocity relative to arc displacement:</p>
                        <div class="equation-card">
                            <div class="equation-raw">\\frac{d^2\\theta}{dt^2} + \\frac{b}{m}\\frac{d\\theta}{dt} + \\frac{g}{L}\\sin(\\theta) = 0</div>
                        </div>
                    </div>
                `;

                document.getElementById('btn-reset-pend').onclick = () => {
                    theta = (params.theta0 * Math.PI) / 180; omega = 0; phasePath = [];
                };
                document.getElementById('btn-play-pend').onclick = (e) => {
                    params.play = !params.play;
                    e.currentTarget.classList.toggle('active', params.play);
                };

                let animId;
                const renderLoop = () => {
                    if (!canvas) return;
                    const w = canvas.width / window.devicePixelRatio;
                    const h = canvas.height / window.devicePixelRatio;
                    ctx.clearRect(0, 0, w, h);

                    if (params.play) {
                        const dt = 0.016;
                        const getDerivatives = (th, om) => {
                            return [om, -(params.g / params.L) * Math.sin(th) - (params.damping / params.m) * om];
                        };
                        const [th1, om1] = getDerivatives(theta, omega);
                        const [th2, om2] = getDerivatives(theta + 0.5 * dt * th1, omega + 0.5 * dt * om1);
                        const [th3, om3] = getDerivatives(theta + 0.5 * dt * th2, omega + 0.5 * dt * om2);
                        const [th4, om4] = getDerivatives(theta + dt * th3, omega + dt * om3);

                        theta += (dt / 6) * (th1 + 2 * th2 + 2 * th3 + th4);
                        omega += (dt / 6) * (om1 + 2 * om2 + 2 * om3 + om4);

                        phasePath.push({ th: theta, om: omega });
                        if (phasePath.length > 120) phasePath.shift();
                    }

                    const originX = w / 2;
                    const originY = 60;
                    const bobX = originX + params.L * 22 * Math.sin(theta);
                    const bobY = originY + params.L * 22 * Math.cos(theta);

                    ctx.fillStyle = '#21262d';
                    ctx.fillRect(originX - 16, originY - 5, 32, 10);
                    ctx.strokeStyle = '#30363d';
                    ctx.strokeRect(originX - 16, originY - 5, 32, 10);

                    ctx.strokeStyle = '#8b949e';
                    ctx.lineWidth = 1.8;
                    ctx.beginPath();
                    ctx.moveTo(originX, originY);
                    ctx.lineTo(bobX, bobY);
                    ctx.stroke();

                    const bobRadius = 10 + params.m * 2;
                    const grad = ctx.createRadialGradient(bobX - 4, bobY - 4, 1, bobX, bobY, bobRadius);
                    grad.addColorStop(0, '#ffffff');
                    grad.addColorStop(0.3, 'var(--accent-cyan)');
                    grad.addColorStop(1, '#005f73');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(bobX, bobY, bobRadius, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.strokeStyle = 'var(--accent-red)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(bobX, bobY);
                    ctx.lineTo(bobX, bobY + params.m * 10);
                    ctx.stroke();

                    ctx.strokeStyle = '#3273dc';
                    ctx.beginPath();
                    ctx.moveTo(bobX, bobY);
                    ctx.lineTo(bobX - Math.sin(theta) * params.m * 10, bobY - Math.cos(theta) * params.m * 10);
                    ctx.stroke();

                    ctx.strokeStyle = 'var(--accent-green)';
                    ctx.beginPath();
                    ctx.moveTo(bobX, bobY);
                    const velX = omega * params.L * Math.cos(theta) * 10;
                    const velY = -omega * params.L * Math.sin(theta) * 10;
                    ctx.lineTo(bobX + velX, bobY + velY);
                    ctx.stroke();

                    ctx.save();
                    const scopeX = w - 120, scopeY = 50, scopeW = 100, scopeH = 100;
                    ctx.fillStyle = 'rgba(10, 12, 14, 0.7)';
                    ctx.fillRect(scopeX, scopeY, scopeW, scopeH);
                    ctx.strokeStyle = '#1c232b';
                    ctx.strokeRect(scopeX, scopeY, scopeW, scopeH);

                    ctx.strokeStyle = '#141a21';
                    ctx.beginPath();
                    ctx.moveTo(scopeX + scopeW/2, scopeY); ctx.lineTo(scopeX + scopeW/2, scopeY + scopeH);
                    ctx.moveTo(scopeX, scopeY + scopeH/2); ctx.lineTo(scopeX + scopeW, scopeY + scopeH/2);
                    ctx.stroke();

                    if (phasePath.length > 1) {
                        ctx.strokeStyle = '#27ae60';
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        phasePath.forEach((p, idx) => {
                            const px = scopeX + scopeW/2 + p.th * 25;
                            const py = scopeY + scopeH/2 - p.om * 10;
                            if (idx === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                        });
                        ctx.stroke();
                    }
                    ctx.fillStyle = '#27ae60';
                    ctx.font = '7px monospace';
                    ctx.fillText('CRT Phase', scopeX + 5, scopeY + 12);
                    ctx.restore();

                    animId = requestAnimationFrame(renderLoop);
                };
                renderLoop();

                window.addEventListener('resize', resize);
                resize();

                const params = { r1: 100, rx: 100 };

                let animId;
                const renderLoop = () => {
                    if (!canvas) return;
                    const w = canvas.width / window.devicePixelRatio;
                    const h = canvas.height / window.devicePixelRatio;
                    ctx.clearRect(0, 0, w, h);

                    const midX = w / 2;
                    const midY = h / 2;

                    // Diamond circuit schematic lines
                    ctx.strokeStyle = '#21262d';
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.moveTo(midX - 100, midY);
                    ctx.lineTo(midX, midY - 60);
                    ctx.lineTo(midX + 100, midY);
                    ctx.lineTo(midX, midY + 60);
                    ctx.closePath();
                    ctx.stroke();

                    // Central Galvanometer Bridge
                    ctx.beginPath();
                    ctx.moveTo(midX, midY - 60);
                    ctx.lineTo(midX, midY + 60);
                    ctx.stroke();

                    ctx.fillStyle = 'var(--accent-orange)';
                    ctx.beginPath(); ctx.arc(midX, midY, 15, 0, Math.PI * 2); ctx.fill();

                    animId = requestAnimationFrame(renderLoop);
                };
                renderLoop();

                this.destroy = () => {
                    cancelAnimationFrame(animId);
                    window.removeEventListener('resize', resize);
                };
            }
        };
        Registry.register(WheatstoneBridge);

        /* =========================================================
           SIMULATION 24: MAGNETIC FIELD OF A WIRE
           ========================================================= */
        const MagneticWire = {
            metadata: {
                id: "magnetic-field-of-a-wire",
                title: "Magnetic Field of a Wire",
                category: "Magnetism",
                subcategory: "Magnetic Fields",
                description: "Trace circular compass flux vectors radiating from straight wire paths.",
                difficulty: "Intermediate",
                tags: ["magnetism", "flux-density", "magnetic-fields"]
            },
            html() {
                return `<canvas class="simulation-canvas" id="canvas-wire"></canvas>`;
            },
            init(container) {
                const canvas = document.getElementById('canvas-wire');
                const ctx = canvas.getContext('2d');
                const resize = () => {
                    const rect = canvas.parentNode.getBoundingClientRect();
                    canvas.width = rect.width * window.devicePixelRatio;
                    canvas.height = rect.height * window.devicePixelRatio;
                    ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
                };
                window.addEventListener('resize', resize);
                resize();

                const params = { current: 15 };

                let animId;
                const renderLoop = () => {
                    if (!canvas) return;
                    const w = canvas.width / window.devicePixelRatio;
                    const h = canvas.height / window.devicePixelRatio;
                    ctx.clearRect(0, 0, w, h);

                    const midX = w / 2;
                    const midY = h / 2;

                    ctx.fillStyle = '#ff3e3e';
                    ctx.beginPath(); ctx.arc(midX, midY, 10, 0, Math.PI * 2); ctx.fill();

                    ctx.strokeStyle = 'rgba(0, 240, 255, 0.25)';
                    ctx.lineWidth = 1;
                    for (let r = 30; r < 150; r += 25) {
                        ctx.beginPath();
                        ctx.arc(midX, midY, r, 0, Math.PI * 2);
                        ctx.stroke();
                    }

                    animId = requestAnimationFrame(renderLoop);
                };
                renderLoop();

                this.destroy = () => {
                    cancelAnimationFrame(animId);
                    window.removeEventListener('resize', resize);
                };
            }
        };
        Registry.register(MagneticWire);

        /* =========================================================
           SIMULATION 25: SNELL'S LAW REFRACTION
           ========================================================= */
        const SnellsLaw = {
            metadata: {
                id: "snell-s-law",
                title: "Snell's Law",
                category: "Optics — Geometrical",
                subcategory: "Snell's Law",
                description: "Refract incident laser rays passing through air-water boundaries.",
                difficulty: "Beginner",
                tags: ["optics", "refraction", "snells-law"]
            },
            html() {
                return `<canvas class="simulation-canvas" id="canvas-snell"></canvas>`;
            },
            init(container) {
                const canvas = document.getElementById('canvas-snell');
                const ctx = canvas.getContext('2d');
                const resize = () => {
                    const rect = canvas.parentNode.getBoundingClientRect();
                    canvas.width = rect.width * window.devicePixelRatio;
                    canvas.height = rect.height * window.devicePixelRatio;
                    ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
                };
                window.addEventListener('resize', resize);
                resize();

                const params = { n2: 1.5, theta1: 45 };

                const updateControlsPanel = () => {
                    const controls = document.getElementById('sim-controls-sidebar');
                    controls.innerHTML = `
                        <div class="sidebar-panel">
                            <h3 class="sidebar-panel-title">Refraction Inputs</h3>
                            <div class="control-group">
                                <div class="control-label-wrapper">
                                    <span class="control-label">Medium Index (n₂)</span>
                                    <span class="control-value" id="val-snell-n2">${params.n2.toFixed(2)}</span>
                                </div>
                                <input type="range" class="sim-slider" id="slider-snell-n2" min="1.0" max="2.0" step="0.05" value="${params.n2}">
                            </div>
                        </div>
                    `;
                    document.getElementById('slider-snell-n2').addEventListener('input', (e) => {
                        params.n2 = parseFloat(e.target.value);
                        document.getElementById('val-snell-n2').textContent = params.n2.toFixed(2);
                    });
                };
                updateControlsPanel();

                let animId;
                const renderLoop = () => {
                    if (!canvas) return;
                    const w = canvas.width / window.devicePixelRatio;
                    const h = canvas.height / window.devicePixelRatio;
                    ctx.clearRect(0, 0, w, h);

                    const midY = h / 2;
                    const midX = w / 2;

                    // Medium backdrop layer
                    ctx.fillStyle = 'rgba(0, 240, 255, 0.08)';
                    ctx.fillRect(0, midY, w, h - midY);

                    // Normal line
                    ctx.strokeStyle = '#21262d';
                    ctx.setLineDash([4, 4]);
                    ctx.beginPath(); ctx.moveTo(midX, 20); ctx.lineTo(midX, h - 20); ctx.stroke();
                    ctx.setLineDash([]);

                    // Incident Laser path
                    const angleRad = (params.theta1 * Math.PI) / 180;
                    const lx = midX - 120 * Math.sin(angleRad);
                    const ly = midY - 120 * Math.cos(angleRad);

                    ctx.strokeStyle = 'var(--accent-red)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(lx, ly);
                    ctx.lineTo(midX, midY);
                    ctx.stroke();

                    // Refracted ray path
                    const n1 = 1.0;
                    const angle2Rad = Math.asin((n1 * Math.sin(angleRad)) / params.n2);
                    const rx = midX + 120 * Math.sin(angle2Rad);
                    const ry = midY + 120 * Math.cos(angle2Rad);

                    ctx.beginPath();
                    ctx.moveTo(midX, midY);
                    ctx.lineTo(rx, ry);
                    ctx.stroke();

                    animId = requestAnimationFrame(renderLoop);
                };
                renderLoop();

                this.destroy = () => {
                    cancelAnimationFrame(animId);
                    window.removeEventListener('resize', resize);
                };
            }
        };
        Registry.register(SnellsLaw);

        /* =========================================================
           UNIVERSAL PARAMETRIC SOLVER ENGINE FALLBACK REGISTER
           ========================================================= */

        const customIds = [
            'projectile-motion', 'simple-pendulum', 'electric-field', 'convex-lens', 'wave-interference',
            'uniformly-accelerated-motion', 'inclined-plane', 'atwood-machine', 'spring-force', 'circular-motion',
            'ohm-s-law', 'magnetic-field-of-a-solenoid', 'doppler-effect', 'double-slit-interference', 'hertzsprung-russell-diagram',
            'uniform-motion', 'relative-motion', 'friction-on-a-surface', 'billiard-ball-collision', 'mass-spring-oscillator',
            'two-body-orbit', 'parallel-plate-capacitor', 'wheatstone-bridge', 'magnetic-field-of-a-wire', 'snell-s-law'
        ];

        systemCategories.forEach(cat => {
            cat.topics.forEach(topic => {
                const topicId = topic.toLowerCase().replace(/[^a-z0-9]+/g, '-');
                if (!customIds.includes(topicId)) {
                    Registry.register(UniversalEngine.create({
                        id: topicId,
                        title: topic,
                        category: cat.category,
                        subcategory: cat.subcategory,
                        description: `Explore the physical mathematics and dynamics governing ${topic}.`,
                        difficulty: "Intermediate",
                        tags: [cat.subcategory.toLowerCase().replace(/\s+/g, '-'), "computational-physics"]
                    }, cat));
                }
            });
        });

        window.addEventListener('DOMContentLoaded', () => {
            App.init();
        });
    </script>
</body>
</html>
