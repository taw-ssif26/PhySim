                            <div class="control-group">
                                <div class="control-label-wrapper">
                                    <span class="control-label">Object Distance (u)</span>
                                    <span class="control-value" id="val-u">${params.u} px</span>
                                </div>
                                <input type="range" class="sim-slider" id="slider-u" min="70" max="400" step="5" value="${params.u}">
                            </div>

                            <div class="control-group">
                                <div class="control-label-wrapper">
                                    <span class="control-label">Object Height (h)</span>
                                    <span class="control-value" id="val-h">${params.h} px</span>
                                </div>
                                <input type="range" class="sim-slider" id="slider-h" min="10" max="100" step="5" value="${params.h}">
                            </div>
                        </div>

                        <div class="sidebar-panel">
                            <h3 class="sidebar-panel-title">Lens Telemetry</h3>
                            <div class="instrumentation-list">
                                <div class="instrumentation-item">
                                    <span class="instrument-label">Image Distance (v)</span>
                                    <span class="instrument-value" id="tele-v">---</span>
                                </div>
                                <div class="instrumentation-item">
                                    <span class="instrument-label">Magnification (m)</span>
                                    <span class="instrument-value" id="tele-m">---</span>
                                </div>
                                <div class="instrumentation-item">
                                    <span class="instrument-label">Image Type</span>
                                    <span class="instrument-value" id="tele-type">---</span>
                                </div>
                            </div>
                        </div>
                    `;

                    document.getElementById('slider-f').addEventListener('input', (e) => {
                        params.f = parseFloat(e.target.value);
                        document.getElementById('val-f').textContent = params.f + ' px';
                    });
                    document.getElementById('slider-u').addEventListener('input', (e) => {
                        params.u = parseFloat(e.target.value);
                        document.getElementById('val-u').textContent = params.u + ' px';
                    });
                    document.getElementById('slider-h').addEventListener('input', (e) => {
                        params.h = parseFloat(e.target.value);
                        document.getElementById('val-h').textContent = params.h + ' px';
                    });
                };

                const updateEduPanel = () => {
                    const edu = document.getElementById('sim-edu-content');
                    edu.innerHTML = `
                        <div class="edu-section">
                            <h3>Thin Lens Equation</h3>
                            <p>For standard geometric thin lenses, the relationship between focal parameters, object coordinates, and projected conjugate image planes is governed by classical gaussian optics:</p>
                            
                            <div class="equation-card">
                                <div class="equation-raw">\\frac{1}{f} = \\frac{1}{u} + \\frac{1}{v}</div>
                                <div class="equation-variables">
                                    <span><strong>f</strong> — Focal distance from center</span>
                                    <span><strong>u</strong> — Object boundary distance</span>
                                    <span><strong>v</strong> — Conjunct real/virtual image plane distance</span>
                                </div>
                            </div>
                        </div>
                        <div class="edu-section">
                            <div class="try-challenge-box">
                                <h4>Interactive Challenges</h4>
                                <p>1. <strong>Focal boundary point:</strong> Place the object exactly on the focal point ($u = f$). Watch how the refracted ray lines project parallel into infinity without producing an image.</p>
                                <p>2. <strong>Magnifying lens setup:</strong> Drag the object closer to the lens than the focal length ($u < f$). Observe how a virtual, magnified, upright image forms behind the object boundary.</p>
                            </div>
                        </div>
                    `;
                };

                // Dragging object using cursor interactions
                const getMousePos = (e) => {
                    const rect = canvas.getBoundingClientRect();
                    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
                };

                const mousedownHandler = (e) => {
                    const pos = getMousePos(e);
                    const midX = canvas.width / (2 * window.devicePixelRatio);
                    const midY = canvas.height / (2 * window.devicePixelRatio);
                    
                    const objX = midX - params.u;
                    const objY = midY - params.h;

                    if (Math.hypot(pos.x - objX, pos.y - objY) < 15) {
                        draggingObject = true;
                    }
                };

                const mousemoveHandler = (e) => {
                    if (draggingObject) {
                        const pos = getMousePos(e);
                        const midX = canvas.width / (2 * window.devicePixelRatio);
                        const midY = canvas.height / (2 * window.devicePixelRatio);

                        params.u = Math.max(10, midX - pos.x);
                        params.h = Math.max(5, midY - pos.y);

                        document.getElementById('slider-u').value = params.u;
                        document.getElementById('val-u').textContent = params.u.toFixed(0) + ' px';
                        document.getElementById('slider-h').value = params.h;
                        document.getElementById('val-h').textContent = params.h.toFixed(0) + ' px';
                    }
                };

                const mouseupHandler = () => {
                    draggingObject = false;
                };

                canvas.addEventListener('mousedown', mousedownHandler);
                canvas.addEventListener('mousemove', mousemoveHandler);
                window.addEventListener('mouseup', mouseupHandler);

                updateControlsPanel();
                updateEduPanel();

                let animId;
                const renderLoop = () => {
                    if (!canvas || !canvas.getContext) return;
                    const w = canvas.width / window.devicePixelRatio;
                    const h = canvas.height / window.devicePixelRatio;
                    ctx.clearRect(0, 0, w, h);

                    const midX = w / 2;
                    const midY = h / 2;

                    // Compute thin lens equations
                    let v = 0;
                    let m = 0;
                    let realImage = true;
                    let infImage = false;

                    if (Math.abs(params.u - params.f) < 0.5) {
                        infImage = true;
                    } else {
                        // Classical lens equation
                        v = (params.u * params.f) / (params.u - params.f);
                        m = -v / params.u;
                        realImage = v > 0;
                    }

                    // Display instrumentation values
                    if (infImage) {
                        document.getElementById('tele-v').textContent = "∞ (Infinity)";
                        document.getElementById('tele-m').textContent = "N/A";
                        document.getElementById('tele-type').textContent = "Parallel Rays";
                    } else {
                        document.getElementById('tele-v').textContent = v.toFixed(1) + ' px';
                        document.getElementById('tele-m').textContent = m.toFixed(2) + 'x';
                        document.getElementById('tele-type').textContent = realImage ? "Real & Inverted" : "Virtual & Upright";
                    }

                    // Draw Horizontal Optical Axis
                    ctx.strokeStyle = '#20262d';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(0, midY); ctx.lineTo(w, midY);
                    ctx.stroke();

                    // Draw vertical Lens element symbol
                    ctx.strokeStyle = 'var(--accent-cyan)';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(midX, midY - 120);
                    ctx.lineTo(midX, midY + 120);
                    ctx.stroke();

                    // Draw lens top and bottom arrows
                    ctx.fillStyle = 'var(--accent-cyan)';
                    ctx.beginPath();
                    ctx.moveTo(midX, midY - 125);
                    ctx.lineTo(midX - 6, midY - 117);
                    ctx.lineTo(midX + 6, midY - 117);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(midX, midY + 125);
                    ctx.lineTo(midX - 6, midY + 117);
                    ctx.lineTo(midX + 6, midY + 117);
                    ctx.fill();

                    // Draw Focal Points F and F'
                    ctx.fillStyle = 'var(--accent-cyan)';
                    ctx.beginPath();
                    ctx.arc(midX - params.f, midY, 4, 0, Math.PI * 2);
                    ctx.arc(midX + params.f, midY, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.font = '10px monospace';
                    ctx.fillText('F', midX - params.f - 4, midY + 15);
                    ctx.fillText("F'", midX + params.f - 4, midY + 15);

                    // Draw source Object (Green Arrow)
                    const objX = midX - params.u;
                    const objY = midY - params.h;
                    ctx.strokeStyle = 'var(--accent-orange)';
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.moveTo(objX, midY);
                    ctx.lineTo(objX, objY);
                    ctx.stroke();

                    // Render Object draggable cap
                    ctx.fillStyle = 'var(--accent-orange)';
                    ctx.beginPath();
                    ctx.moveTo(objX - 6, objY);
                    ctx.lineTo(objX + 6, objY);
                    ctx.lineTo(objX, objY - 8);
                    ctx.fill();

                    // Render principal geometric light rays if image is not infinitely parallel
                    if (!infImage) {
                        const imgX = midX + v;
                        const imgY = midY + (params.h * m);

                        // Ray 1: Parallel to Optical Axis, then refracted through F'
                        ctx.strokeStyle = 'rgba(0, 240, 255, 0.4)';
                        ctx.lineWidth = 1.5;
                        ctx.beginPath();
                        ctx.moveTo(objX, objY);
                        ctx.lineTo(midX, objY);
                        ctx.lineTo(imgX, imgY);
                        ctx.stroke();

                        // Ray 2: Passing straight through the center of the lens
                        ctx.beginPath();
                        ctx.moveTo(objX, objY);
                        ctx.lineTo(midX, midY);
                        ctx.lineTo(imgX, imgY);
                        ctx.stroke();

                        // Ray 3: Through focus point then parallel to axis
                        ctx.beginPath();
                        ctx.moveTo(objX, objY);
                        ctx.lineTo(midX, midY - (imgY - midY) / m);
                        ctx.lineTo(midX, imgY);
                        ctx.lineTo(imgX, imgY);
                        ctx.stroke();

                        // Draw resulting Projected Image (Violet arrow)
                        ctx.strokeStyle = 'var(--accent-violet)';
                        ctx.lineWidth = 4;
                        ctx.beginPath();
                        ctx.moveTo(imgX, midY);
                        ctx.lineTo(imgX, imgY);
                        ctx.stroke();

                        ctx.fillStyle = 'var(--accent-violet)';
                        ctx.beginPath();
                        ctx.arc(imgX, imgY, 4, 0, Math.PI * 2);
                        ctx.fill();
                    } else {
                        // Drawing infinite Parallel Rays
                        ctx.strokeStyle = 'rgba(0, 240, 255, 0.4)';
                        ctx.lineWidth = 1.5;
                        // Parallel Ray 1
                        ctx.beginPath();
                        ctx.moveTo(objX, objY);
                        ctx.lineTo(midX, objY);
                        ctx.lineTo(midX + 300, objY + (300 * params.h) / params.f);
                        ctx.stroke();

                        // Straight Central Ray 2
                        ctx.beginPath();
                        ctx.moveTo(objX, objY);
                        ctx.lineTo(midX, midY);
                        ctx.lineTo(midX + 300, midY + (300 * params.h) / params.u);
                        ctx.stroke();
                    }

                    animId = requestAnimationFrame(renderLoop);
                };

                renderLoop();

                this.destroy = () => {
                    cancelAnimationFrame(animId);
                    window.removeEventListener('resize', resize);
                    canvas.removeEventListener('mousedown', mousedownHandler);
                    canvas.removeEventListener('mousemove', mousemoveHandler);
                    window.removeEventListener('mouseup', mouseupHandler);
                };
            }
        };
        Registry.register(ConvexLens);

        /* =========================================================
           EXPERIMENT 05: WAVE INTERFERENCE
           ========================================================= */
        const WaveInterference = {
            metadata: {
                id: "wave-interference",
                title: "Wave Field Superposition Map",
                category: "Waves",
                subcategory: "Wave Interference",
                description: "Visualize classical coherent wave oscillations radiating from two discrete coherent sources.",
                difficulty: "Intermediate",
                tags: ["waves", "interference", "constructive", "coherence"]
            },

            html() {
                return `
                    <canvas class="simulation-canvas" id="canvas-waves"></canvas>
                `;
            },

            init(container) {
                const canvas = document.getElementById('canvas-waves');
                const ctx = canvas.getContext('2d');

                const resize = () => {
                    const rect = canvas.parentNode.getBoundingClientRect();
                    canvas.width = rect.width * window.devicePixelRatio;
                    canvas.height = rect.height * window.devicePixelRatio;
                    ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
                };
                window.addEventListener('resize', resize);
                resize();

                const params = {
                    amplitude: 20,
                    wavelength: 35,
                    freq: 3.0,
                    sep: 100, // Distance separation between sources
                };

                let t = 0;

                const updateControlsPanel = () => {
                    const controls = document.getElementById('sim-controls-sidebar');
                    controls.innerHTML = `
                        <div class="sidebar-panel">
                            <h3 class="sidebar-panel-title">Wave Parameters</h3>
                            
                            <div class="control-group">
                                <div class="control-label-wrapper">
                                    <span class="control-label">Oscillation Wavelength</span>
                                    <span class="control-value" id="val-wave-len">${params.wavelength} px</span>
                                </div>
                                <input type="range" class="sim-slider" id="slider-wave-len" min="15" max="80" step="2" value="${params.wavelength}">
                            </div>

                            <div class="control-group">
                                <div class="control-label-wrapper">
                                    <span class="control-label">Source Frequency</span>
                                    <span class="control-value" id="val-wave-freq">${params.freq.toFixed(1)} Hz</span>
                                </div>
                                <input type="range" class="sim-slider" id="slider-wave-freq" min="1.0" max="6.0" step="0.2" value="${params.freq}">
                            </div>

                            <div class="control-group">
                                <div class="control-label-wrapper">
                                    <span class="control-label">Source Separation (d)</span>
                                    <span class="control-value" id="val-wave-sep">${params.sep} px</span>
                                </div>
                                <input type="range" class="sim-slider" id="slider-wave-sep" min="40" max="180" step="5" value="${params.sep}">
                            </div>
                        </div>

                        <div class="sidebar-panel">
                            <h3 class="sidebar-panel-title">System Status</h3>
                            <div class="instrumentation-list">
                                <div class="instrumentation-item">
                                    <span class="instrument-label">Wave Velocity (v)</span>
                                    <span class="instrument-value" id="tele-v-wave">---</span>
                                </div>
                                <div class="instrumentation-item">
                                    <span class="instrument-label">Interference Coherence</span>
                                    <span class="instrument-value" style="color: var(--accent-orange)">Phase-locked</span>
                                </div>
                            </div>
                        </div>
                    `;

                    document.getElementById('slider-wave-len').addEventListener('input', (e) => {
                        params.wavelength = parseFloat(e.target.value);
                        document.getElementById('val-wave-len').textContent = params.wavelength + ' px';
                    });
                    document.getElementById('slider-wave-freq').addEventListener('input', (e) => {
                        params.freq = parseFloat(e.target.value);
                        document.getElementById('val-wave-freq').textContent = params.freq.toFixed(1) + ' Hz';
                    });
                    document.getElementById('slider-wave-sep').addEventListener('input', (e) => {
                        params.sep = parseFloat(e.target.value);
                        document.getElementById('val-wave-sep').textContent = params.sep + ' px';
                    });
                };

                const updateEduPanel = () => {
                    const edu = document.getElementById('sim-edu-content');
                    edu.innerHTML = `
                        <div class="edu-section">
                            <h3>Superposition Principle</h3>
                            <p>Interference maps the absolute algebraic spatial summation of individual wave peaks and troughs at every intersecting point of propagation coordinate space:</p>
                            
                            <div class="equation-card">
                                <div class="equation-raw">z(x, y, t) = A_1 \\cos(k r_1 - \\omega t) + A_2 \\cos(k r_2 - \\omega t)</div>
                                <div class="equation-variables">
                                    <span><strong>r_1, r_2</strong> — Coordinate distance pathways to sources</span>
                                    <span><strong>k</strong> — Wave number (2&pi; / &lambda;)</span>
                                    <span><strong>&omega;</strong> — Angular wave frequency (2&pi;f)</span>
                                </div>
                            </div>
                        </div>
                        <div class="edu-section">
                            <div class="try-challenge-box">
                                <h4>Interactive Challenges</h4>
                                <p>1. <strong>Observe Fringes:</strong> Identify distinct dark structural vector paths emanating outwards. These are regions of <strong>destructive interference</strong>, where peaks directly counter and cancel out troughs.</p>
                                <p>2. <strong>Frequency density:</strong> Increase the source frequency parameter to its maximum limit. Observe how the destructive interference nodes compress closely together.</p>
                            </div>
                        </div>
                    `;
                };

                updateControlsPanel();
                updateEduPanel();

                let animId;
                const renderLoop = () => {
                    if (!canvas || !canvas.getContext) return;
                    const w = canvas.width / window.devicePixelRatio;
                    const h = canvas.height / window.devicePixelRatio;
                    
                    t += 0.08 * params.freq;

                    // Telemetry
                    const velocity = params.wavelength * params.freq;
                    document.getElementById('tele-v-wave').textContent = velocity.toFixed(1) + ' px/s';

                    // Draw background simulation
                    ctx.fillStyle = '#07090c';
                    ctx.fillRect(0, 0, w, h);

                    const s1 = { x: w / 2, y: h / 2 - params.sep / 2 };
                    const s2 = { x: w / 2, y: h / 2 + params.sep / 2 };

                    const k = (2 * Math.PI) / params.wavelength;

                    // Low-resolution structural pixel wave field renderer for high canvas rendering performance
                    const res = 6; 
                    for (let x = 0; x < w; x += res) {
                        for (let y = 0; y < h; y += res) {
                            const d1 = Math.hypot(x - s1.x, y - s1.y);
                            const d2 = Math.hypot(x - s2.x, y - s2.y);

                            const z1 = Math.sin(k * d1 - t);
                            const z2 = Math.sin(k * d2 - t);

                            const combined = (z1 + z2) / 2.0;

                            // Scale into custom technical green/blue/black color scheme based on displacement value
                            let color;
                            if (combined > 0) {
                                const r = Math.floor(combined * 120);
                                const g = Math.floor(combined * 240);
                                color = `rgb(${r}, ${g}, 255)`;
                            } else {
                                const b = Math.floor(Math.abs(combined) * 160);
                                color = `rgb(0, 0, ${b})`;
                            }

                            ctx.fillStyle = color;
                            ctx.fillRect(x, y, res, res);
                        }
                    }

                    // Render source circles
                    ctx.fillStyle = 'var(--accent-cyan)';
                    ctx.beginPath();
                    ctx.arc(s1.x, s1.y, 6, 0, Math.PI * 2);
                    ctx.arc(s2.x, s2.y, 6, 0, Math.PI * 2);
                    ctx.fill();

                    animId = requestAnimationFrame(renderLoop);
                };

                renderLoop();

                this.destroy = () => {
                    cancelAnimationFrame(animId);
                    window.removeEventListener('resize', resize);
                };
            }
        };
        Registry.register(WaveInterference);

        // Run application on initialization
        window.addEventListener('DOMContentLoaded', () => {
            App.init();
        });
    </script>
</body>
</html>
