<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Simulation Laboratory</title>
    <!-- Premium Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* =========================================================
           GLOBAL CSS & VARIABLES
           ========================================================= */
        :root {
            --bg-base: #080a0c;
            --bg-surface: #101418;
            --bg-surface-elevated: #161c22;
            --border-subtle: #20262d;
            --border-accent: #30363d;
            
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --text-muted: #484f58;
            
            --accent-cyan: #00f0ff;
            --accent-cyan-glow: rgba(0, 240, 255, 0.25);
            --accent-violet: #8a2be2;
            --accent-orange: #ff7f50;
            --accent-red: #ff4a4a;
            --accent-blue: #1f6feb;
            --accent-yellow: #ffd700;
            
            --font-ui: 'Inter', system-ui, sans-serif;
            --font-display: 'Space Grotesk', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            
            --transition-smooth: 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: var(--font-ui);
            line-height: 1.5;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* Technical Grid Background overlay */
        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 1;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-base);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-subtle);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--border-accent);
        }

        /* Layout framework */
        header {
            position: sticky;
            top: 0;
            width: 100%;
            height: 70px;
            background-color: rgba(8, 10, 12, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            z-index: 100;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .logo-symbol {
            width: 24px;
            height: 24px;
            border: 2px solid var(--accent-cyan);
            border-radius: 50%;
            position: relative;
            animation: pulse-ring 4s infinite linear;
        }

        .logo-symbol::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 8px;
            background: var(--accent-cyan);
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        @keyframes pulse-ring {
            0% { transform: rotate(0deg); border-style: solid; }
            50% { border-color: var(--accent-violet); }
            100% { transform: rotate(360deg); }
        }

        .logo-text {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .logo-text span {
            color: var(--accent-cyan);
            font-weight: 400;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 32px;
        }

        nav a {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            transition: var(--transition-smooth);
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
        }

        nav a:hover, nav a.active {
            color: var(--accent-cyan);
        }

        .nav-status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: rgba(0, 240, 255, 0.05);
            border: 1px solid rgba(0, 240, 255, 0.15);
            border-radius: 4px;
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--accent-cyan);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: var(--accent-cyan);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-cyan);
            animation: pulse-dot 1.5s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        main {
            position: relative;
            z-index: 10;
            min-height: calc(100vh - 70px);
        }

        /* Generic utilities */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 20px;
            background: var(--bg-surface-elevated);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            font-family: var(--font-ui);
            font-size: 0.85rem;
            font-weight: 500;
            border-radius: 4px;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .btn:hover {
            border-color: var(--accent-cyan);
            background: rgba(0, 240, 255, 0.02);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.05);
        }

        .btn-primary {
            background: var(--accent-cyan);
            color: var(--bg-base);
            border: 1px solid var(--accent-cyan);
            font-weight: 600;
        }

        .btn-primary:hover {
            background: #00d2e0;
            border-color: #00d2e0;
            color: var(--bg-base);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
        }

        /* =========================================================
           HOME VIEW STYLES
           ========================================================= */
        .hero {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 120px 20px 80px 20px;
            overflow: hidden;
        }

        .hero-canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.45;
            pointer-events: none;
        }

        .hero-pretitle {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--accent-cyan);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .hero-title {
            font-family: var(--font-display);
            font-size: clamp(3rem, 6vw, 4.5rem);
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: -1px;
            margin-bottom: 24px;
            background: linear-gradient(135deg, #fff 40%, var(--text-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-description {
            max-width: 650px;
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: 40px;
            font-weight: 300;
        }

        /* Home Explore Section */
        .home-section {
            padding: 60px 40px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .section-header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            margin-bottom: 40px;
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: 16px;
        }

        .section-title-wrapper h2 {
            font-family: var(--font-display);
            font-size: 1.8rem;
            font-weight: 600;
        }

        .section-title-wrapper p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 4px;
        }

        /* =========================================================
           BROWSER STYLES
           ========================================================= */
        .browser-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            min-height: calc(100vh - 70px);
            max-width: 100%;
        }

        .browser-sidebar {
            border-right: 1px solid var(--border-subtle);
            padding: 32px;
            background-color: rgba(16, 20, 24, 0.3);
        }

        .sidebar-section {
            margin-bottom: 32px;
        }

        .sidebar-title {
            font-family: var(--font-display);
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-secondary);
            margin-bottom: 16px;
        }

        .category-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .category-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            border-radius: 4px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .category-item:hover, .category-item.active {
            background-color: var(--bg-surface-elevated);
            color: var(--text-primary);
        }

        .category-item.active {
            border-left: 2px solid var(--accent-cyan);
        }

        .category-count {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            background-color: rgba(255, 255, 255, 0.05);
            padding: 2px 6px;
            border-radius: 3px;
        }

        .browser-main {
            padding: 40px;
        }

        .search-bar-container {
            display: flex;
            gap: 16px;
            margin-bottom: 40px;
        }

        .search-input-wrapper {
            position: relative;
            flex: 1;
        }

        .search-input {
            width: 100%;
            height: 48px;
            background-color: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 4px;
            padding: 0 16px 0 48px;
            color: var(--text-primary);
            font-family: var(--font-ui);
            font-size: 0.95rem;
            transition: var(--transition-smooth);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent-cyan);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.08);
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        /* Catalog-style experiment cards */
        .experiment-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 24px;
        }

        .experiment-card {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 4px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: var(--transition-smooth);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .experiment-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-violet));
            opacity: 0;
            transition: var(--transition-smooth);
        }

        .experiment-card:hover {
            transform: translateY(-4px);
            border-color: var(--border-accent);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
        }

        .experiment-card:hover::before {
            opacity: 1;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .card-meta {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--accent-cyan);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card-difficulty {
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 500;
        }

        .diff-beginner { background: rgba(0, 240, 255, 0.08); color: var(--accent-cyan); }
        .diff-intermediate { background: rgba(255, 127, 80, 0.08); color: var(--accent-orange); }
        .diff-advanced { background: rgba(138, 43, 226, 0.08); color: #b175ff; }

        .card-title {
            font-family: var(--font-display);
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .card-description {
            color: var(--text-secondary);
            font-size: 0.85rem;
            line-height: 1.4;
            margin-bottom: 20px;
            flex-grow: 1;
        }

        .card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: auto;
        }

        .tag {
            font-family: var(--font-mono);
            font-size: 0.65rem;
            background-color: var(--bg-surface-elevated);
            color: var(--text-secondary);
            padding: 3px 8px;
            border-radius: 3px;
        }

        /* =========================================================
           EXPERIMENT WORKSPACE LAYOUT
           ========================================================= */
        .workspace {
            display: flex;
            flex-direction: column;
            min-height: calc(100vh - 70px);
            background-color: var(--bg-base);
        }

        .workspace-header {
            border-bottom: 1px solid var(--border-subtle);
            padding: 24px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--bg-surface);
        }

        .breadcrumb {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .breadcrumb span {
            color: var(--accent-cyan);
            cursor: pointer;
        }

        .workspace-title {
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 600;
        }

        .workspace-grid {
            display: grid;
            grid-template-columns: 1fr 340px;
            flex-grow: 1;
            min-height: 500px;
        }

        .canvas-area {
            position: relative;
            background-color: #0b0e12;
            display: flex;
            align-items: center;
            justify-content: center;
            border-right: 1px solid var(--border-subtle);
            padding: 20px;
            overflow: hidden;
        }

        .simulation-canvas-wrapper {
            position: relative;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 16/9;
            background-color: #07090c;
            border: 1px solid var(--border-subtle);
            border-radius: 4px;
            overflow: hidden;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
        }

        .simulation-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .canvas-toolbar {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(16, 20, 24, 0.95);
            border: 1px solid var(--border-accent);
            border-radius: 4px;
            display: flex;
            padding: 4px;
            gap: 4px;
            backdrop-filter: blur(8px);
            z-index: 20;
        }

        .toolbar-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            width: 32px;
            height: 32px;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .toolbar-btn:hover {
            color: var(--accent-cyan);
            background-color: rgba(255, 255, 255, 0.05);
        }

        .toolbar-btn.active {
            color: var(--bg-base);
            background-color: var(--accent-cyan);
        }

        /* Control panel on right */
        .workspace-sidebar {
            display: flex;
            flex-direction: column;
            background-color: var(--bg-surface);
            overflow-y: auto;
            max-height: calc(100vh - 150px);
        }

        .sidebar-panel {
            padding: 24px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .sidebar-panel-title {
            font-family: var(--font-display);
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-secondary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Scientific Slider & Control elements */
        .control-group {
            margin-bottom: 20px;
        }

        .control-label-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px;
            font-size: 0.8rem;
        }

        .control-label {
            color: var(--text-secondary);
            font-weight: 500;
        }

        .control-value {
            font-family: var(--font-mono);
            color: var(--accent-cyan);
        }

        .slider-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sim-slider {
            flex-grow: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 4px;
            border-radius: 2px;
            background: var(--border-subtle);
            outline: none;
            transition: var(--transition-smooth);
        }

        .sim-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent-cyan);
            cursor: pointer;
            border: 2px solid var(--bg-surface);
            box-shadow: 0 0 10px var(--accent-cyan-glow);
            transition: var(--transition-smooth);
        }

        .sim-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        /* Scientific Button States inside controls */
        .btn-group {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        .btn-small {
            padding: 8px 12px;
            font-size: 0.75rem;
            border-radius: 3px;
        }

        /* Instrumentation readout system */
        .instrumentation-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .instrumentation-item {
            background-color: var(--bg-surface-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: 4px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .instrument-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
        }

        .instrument-value {
            font-family: var(--font-mono);
            font-size: 0.95rem;
            color: var(--accent-cyan);
            font-weight: 500;
        }

        /* Educational section below */
        .educational-area {
            background-color: var(--bg-surface);
            border-top: 1px solid var(--border-subtle);
            padding: 48px;
        }

        .educational-content {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 60px;
        }

        .edu-section h3 {
            font-family: var(--font-display);
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .edu-section p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        /* Technical equation card */
        .equation-card {
            background-color: var(--bg-surface-elevated);
            border-left: 3px solid var(--accent-cyan);
            border-radius: 0 4px 4px 0;
            padding: 24px;
            margin: 20px 0;
        }

        .equation-raw {
            font-family: var(--font-mono);
            font-size: 1.4rem;
            color: var(--text-primary);
            text-align: center;
            margin-bottom: 16px;
            letter-spacing: 1px;
        }

        .equation-variables {
            font-size: 0.8rem;
            color: var(--text-secondary);
            display: flex;
            flex-direction: column;
            gap: 6px;
            border-top: 1px solid var(--border-subtle);
            padding-top: 12px;
        }

        .try-challenge-box {
            background: rgba(138, 43, 226, 0.05);
            border: 1px dashed rgba(138, 43, 226, 0.3);
            border-radius: 4px;
            padding: 24px;
        }

        .try-challenge-box h4 {
            color: #b175ff;
            font-family: var(--font-display);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Creator Signature Footer */
        .creator-signature {
            border-top: 1px solid var(--border-subtle);
            background-color: var(--bg-base);
            padding: 40px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .creator-signature a {
            color: var(--accent-cyan);
            font-weight: 500;
            transition: var(--transition-smooth);
        }

        .creator-signature a:hover {
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .workspace-grid {
                grid-template-columns: 1fr;
            }
            .canvas-area {
                border-right: none;
                border-bottom: 1px solid var(--border-subtle);
            }
            .educational-content {
                grid-template-columns: 1fr;
                gap: 40px;
            }
            .browser-layout {
                grid-template-columns: 1fr;
            }
            .browser-sidebar {
                border-right: none;
                border-bottom: 1px solid var(--border-subtle);
            }
        }

        @media (max-width: 600px) {
            header {
                padding: 0 20px;
            }
            nav {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div class="grid-overlay"></div>

    <!-- MAIN HEADER -->
    <header>
        <div class="logo-container" onclick="App.navigate('home')">
            <div class="logo-symbol"></div>
            <div class="logo-text">Physics<span>Lab</span></div>
        </div>
        <nav>
            <a id="nav-home" onclick="App.navigate('home')">Home</a>
            <a id="nav-browser" onclick="App.navigate('browser')">Lab Browser</a>
            <div class="nav-status">
                <span class="status-dot"></span>
                <span>SYSTEM: READY</span>
            </div>
        </nav>
    </header>

    <!-- CONTENT CONTAINER -->
    <main id="app-viewport">
        <!-- Dynamically loaded view contents appear here -->
    </main>

    <!-- FOOTER / SIGNATURE -->
    <div class="creator-signature">
        <p>Built by <a href="https://tawsif-dev.vercel.app" target="_blank" rel="noopener noreferrer">Md Abu Tawsif</a> — exploring the intersection of programming, visualization and science.</p>
    </div>

    <!-- =========================================================
         APPLICATION CORE & UTILITIES
         ========================================================= -->
    <script>
        /* =========================================================
           SHARED PHYSICS UTILITIES
           ========================================================= */
        const PhysicsUtils = {
            Vector2: class {
                constructor(x = 0, y = 0) {
                    this.x = x;
                    this.y = y;
                }
                set(x, y) { this.x = x; this.y = y; return this; }
                add(v) { this.x += v.x; this.y += v.y; return this; }
                sub(v) { this.x -= v.x; this.y -= v.y; return this; }
                mult(s) { this.x *= s; this.y *= s; return this; }
                mag() { return Math.hypot(this.x, this.y); }
                normalize() {
                    const m = this.mag();
                    if (m > 0) this.mult(1 / m);
                    return this;
                }
                copy() { return new PhysicsUtils.Vector2(this.x, this.y); }
            },

            g: 9.80665,
            k_e: 8.98755e9,
            c: 299792458,
            
            formatValue(val, unit, decimals = 3) {
                if (val === undefined || isNaN(val)) return `---`;
                if (Math.abs(val) > 1e6 || (Math.abs(val) < 1e-4 && val !== 0)) {
                    return `${val.toExponential(decimals)} ${unit}`;
                }
                return `${val.toFixed(decimals)} ${unit}`;
            }
        };

        /* =========================================================
           EXPERIMENT REGISTRY
           ========================================================= */
        const Registry = {
            experiments: new Map(),
            register(experiment) {
                this.experiments.set(experiment.metadata.id, experiment);
            },
            get(id) {
                return this.experiments.get(id);
            },
            getAll() {
                return Array.from(this.experiments.values());
            }
        };

        /* =========================================================
           APPLICATION CORE ENGINE
           ========================================================= */
        const App = {
            state: {
                currentView: 'home',
                activeExperimentId: null,
                searchQuery: '',
                selectedCategory: 'All',
                activeExperiment: null
            },
            heroSimId: null,

            init() {
                this.navigate('home');
                
                window.addEventListener('popstate', (e) => {
                    if (e.state && e.state.view) {
                        this.navigate(e.state.view, e.state.experimentId, false);
                    }
                });
            },

            navigate(view, experimentId = null, pushState = true) {
                if (this.state.activeExperiment) {
                    this.state.activeExperiment.destroy();
                    this.state.activeExperiment = null;
                }
                if (this.heroSimId) {
                    cancelAnimationFrame(this.heroSimId);
                    this.heroSimId = null;
                }

                this.state.currentView = view;
                this.state.activeExperimentId = experimentId;

                document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
                const navLink = document.getElementById(`nav-${view}`);
                if (navLink) navLink.classList.add('active');

                const viewport = document.getElementById('app-viewport');
                viewport.innerHTML = '';

                if (pushState) {
                    const path = experimentId ? `?view=${view}&id=${experimentId}` : `?view=${view}`;
                    history.pushState({ view, experimentId }, '', path);
                }

                if (view === 'home') {
                    this.renderHome(viewport);
                } else if (view === 'browser') {
                    this.renderBrowser(viewport);
                } else if (view === 'experiment' && experimentId) {
                    this.renderWorkspace(viewport, experimentId);
                }
            },

            renderHome(container) {
                container.innerHTML = `
                    <section class="hero">
                        <div class="hero-canvas-container" id="hero-canvas-host"></div>
                        <div class="hero-pretitle">Digital Scientific Exploration</div>
                        <h1 class="hero-title">Physics, You Can See.</h1>
                        <p class="hero-description">Explore the laws of physics through interactive simulations, precise calculations, and visual experiments.</p>
                        <div style="display: flex; gap: 16px;">
                            <button class="btn btn-primary" onclick="App.navigate('browser')">Open Laboratory</button>
                        </div>
                    </section>

                    <section class="home-section">
                        <div class="section-header">
                            <div class="section-title-wrapper">
                                <h2>Featured Simulations</h2>
                                <p>Begin running analytical systems and adjusting foundational constants</p>
                            </div>
                            <button class="btn" onclick="App.navigate('browser')">View All Systems</button>
                        </div>
                        <div class="experiment-grid" id="featured-experiments"></div>
                    </section>
                `;

                const grid = document.getElementById('featured-experiments');
                Registry.getAll().slice(0, 3).forEach(exp => {
                    grid.appendChild(this.createExperimentCard(exp));
                });

                this.initHeroSimulation();
            },

            renderBrowser(container) {
                container.innerHTML = `
                    <div class="browser-layout">
                        <aside class="browser-sidebar">
                            <div class="sidebar-section">
                                <h3 class="sidebar-title">Categories</h3>
                                <ul class="category-list" id="sidebar-categories">
                                    <li class="category-item active" data-cat="All">
                                        <span>All Disciplines</span>
                                        <span class="category-count">${Registry.getAll().length}</span>
                                    </li>
                                </ul>
                            </div>
                        </aside>
                        <main class="browser-main">
                            <div class="search-bar-container">
                                <div class="search-input-wrapper">
                                    <svg class="search-icon" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                                    <input type="text" class="search-input" id="sim-search" placeholder="Search physical laws, tags, categories..." value="${this.state.searchQuery}">
                                </div>
                            </div>
                            <div class="experiment-grid" id="browser-grid"></div>
                        </main>
                    </div>
                `;

                this.buildSidebarCategories();
                this.filterExperiments();

                document.getElementById('sim-search').addEventListener('input', (e) => {
                    this.state.searchQuery = e.target.value;
                    this.filterExperiments();
                });
            },

            buildSidebarCategories() {
                const sidebar = document.getElementById('sidebar-categories');
                const categories = new Set(Registry.getAll().map(e => e.metadata.category));
                
                categories.forEach(cat => {
                    const count = Registry.getAll().filter(e => e.metadata.category === cat).length;
                    const li = document.createElement('li');
                    li.className = `category-item ${this.state.selectedCategory === cat ? 'active' : ''}`;
                    li.setAttribute('data-cat', cat);
                    li.innerHTML = `
                        <span>${cat}</span>
                        <span class="category-count">${count}</span>
                    `;
                    sidebar.appendChild(li);
                });

                sidebar.querySelectorAll('.category-item').forEach(item => {
                    item.addEventListener('click', () => {
                        sidebar.querySelectorAll('.category-item').forEach(li => li.classList.remove('active'));
                        item.classList.add('active');
                        this.state.selectedCategory = item.getAttribute('data-cat');
                        this.filterExperiments();
                    });
                });
            },

            filterExperiments() {
                const grid = document.getElementById('browser-grid');
                if (!grid) return;
                grid.innerHTML = '';

                const query = this.state.searchQuery.toLowerCase();
                const filtered = Registry.getAll().filter(exp => {
                    const matchesCategory = this.state.selectedCategory === 'All' || exp.metadata.category === this.state.selectedCategory;
                    const matchesSearch = exp.metadata.title.toLowerCase().includes(query) || 
                                          exp.metadata.description.toLowerCase().includes(query) || 
                                          exp.metadata.tags.some(tag => tag.toLowerCase().includes(query));
                    return matchesCategory && matchesSearch;
                });

                if (filtered.length === 0) {
                    grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-secondary); padding: 40px;">No simulations matched your query.</div>`;
                } else {
                    filtered.forEach(exp => {
                        grid.appendChild(this.createExperimentCard(exp));
                    });
                }
            },

            createExperimentCard(exp) {
                const card = document.createElement('div');
                card.className = 'experiment-card';
                card.onclick = () => this.navigate('experiment', exp.metadata.id);
                
                card.innerHTML = `
                    <div>
                        <div class="card-top">
                            <span class="card-meta">${exp.metadata.subcategory}</span>
                            <span class="card-difficulty diff-${exp.metadata.difficulty.toLowerCase()}">${exp.metadata.difficulty}</span>
                        </div>
                        <h3 class="card-title">${exp.metadata.title}</h3>
                        <p class="card-description">${exp.metadata.description}</p>
                    </div>
                    <div class="card-tags">
                        ${exp.metadata.tags.map(tag => `<span class="tag">#${tag}</span>`).join('')}
                    </div>
                `;
                return card;
            },

            renderWorkspace(container, id) {
                const exp = Registry.get(id);
                if (!exp) {
                    container.innerHTML = `<div>Simulation Not Found.</div>`;
                    return;
                }

                this.state.activeExperiment = exp;

                container.innerHTML = `
                    <div class="workspace">
                        <div class="workspace-header">
                            <div>
                                <div class="breadcrumb"><span onclick="App.navigate('browser')">Lab Browser</span> / ${exp.metadata.category}</div>
                                <h1 class="workspace-title">${exp.metadata.title}</h1>
                            </div>
                            <button class="btn" onclick="App.navigate('browser')">Return to Catalog</button>
                        </div>
                        <div class="workspace-grid">
                            <div class="canvas-area">
                                <div class="simulation-canvas-wrapper" id="canvas-wrapper-host">
                                    ${exp.html()}
                                </div>
                            </div>
                            <div class="workspace-sidebar" id="sim-controls-sidebar"></div>
                        </div>
                        <div class="educational-area">
                            <div class="educational-content" id="sim-edu-content"></div>
                        </div>
                    </div>
                `;

                if (exp.css) {
                    let styleTag = document.getElementById('experiment-custom-styles');
                    if (!styleTag) {
                        styleTag = document.createElement('style');
                        styleTag.id = 'experiment-custom-styles';
                        document.head.appendChild(styleTag);
                    }
                    styleTag.textContent = exp.css();
                }

                exp.init(document.getElementById('canvas-wrapper-host'));
            },

            initHeroSimulation() {
                const container = document.getElementById('hero-canvas-host');
                if (!container) return;

                const canvas = document.createElement('canvas');
                canvas.width = container.clientWidth;
                canvas.height = container.clientHeight || 500;
                container.appendChild(canvas);
                const ctx = canvas.getContext('2d');

                const resizeHandler = () => {
                    canvas.width = container.clientWidth;
                    canvas.height = container.clientHeight || 500;
                };
                window.addEventListener('resize', resizeHandler);

                const particles = [];
                for (let i = 0; i < 60; i++) {
                    particles.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        vx: (Math.random() - 0.5) * 1.5,
                        vy: (Math.random() - 0.5) * 1.5,
                        radius: Math.random() * 2 + 1
                    });
                }

                const animate = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = "rgba(0, 240, 255, 0.15)";
                    ctx.strokeStyle = "rgba(0, 240, 255, 0.04)";

                    for (let i = 0; i < particles.length; i++) {
                        const p = particles[i];
                        p.x += p.vx;
                        p.y += p.vy;

                        if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                        if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                        ctx.fill();

                        for (let j = i + 1; j < particles.length; j++) {
                            const p2 = particles[j];
                            const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                            if (dist < 120) {
                                ctx.beginPath();
                                ctx.moveTo(p.x, p.y);
                                ctx.lineTo(p2.x, p2.y);
                                ctx.stroke();
                            }
                        }
                    }

                    this.heroSimId = requestAnimationFrame(animate);
                };

                animate();
            }
        };

        /* =========================================================
           EXPERIMENT 01: PROJECTILE MOTION
           ========================================================= */
        const ProjectileMotion = {
            metadata: {
                id: "projectile-motion",
                title: "Projectile Motion Analysis",
                category: "Mechanics",
                subcategory: "Kinematics",
                description: "Simulate trajectories of classical mass points under constant gravitation with vector indicators and optional Stokes air drag coefficients.",
                difficulty: "Beginner",
                tags: ["kinematics", "gravity", "trajectory", "vectors"]
            },

            html() {
                return `
                    <canvas class="simulation-canvas" id="canvas-projectile"></canvas>
                    <div class="canvas-toolbar">
                        <button class="toolbar-btn active" id="btn-play-proj">◀▶</button>
                        <button class="toolbar-btn" id="btn-reset-proj">↻</button>
                    </div>
                `;
            },

            css() {
                return ``;
            },

            init(container) {
                const canvas = document.getElementById('canvas-projectile');
                const ctx = canvas.getContext('2d');
                
                // Track dynamic dimensions
                const resize = () => {
                    const rect = canvas.parentNode.getBoundingClientRect();
                    canvas.width = rect.width * window.devicePixelRatio;
                    canvas.height = rect.height * window.devicePixelRatio;
                    ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
                };
                window.addEventListener('resize', resize);
                resize();

                // Initial parameters
                const params = {
                    v0: 30,      // m/s
                    theta: 45,   // degrees
                    h0: 0,       // m
                    g: 9.81,     // m/s^2
                    drag: 0.1,   // drag coeff
                    play: true
                };

                // Physics state
                let t = 0;
                let path = [];
                let finished = false;

                const getPositionAt = (time) => {
                    const angleRad = (params.theta * Math.PI) / 180;
                    const vx0 = params.v0 * Math.cos(angleRad);
                    const vy0 = params.v0 * Math.sin(angleRad);

                    if (params.drag === 0) {
                        const x = vx0 * time;
                        const y = params.h0 + vy0 * time - 0.5 * params.g * time * time;
                        const vx = vx0;
                        const vy = vy0 - params.g * time;
                        return { x, y, vx, vy };
                    } else {
                        // Analytical solution to linear air resistance (Stokes' Drag)
                        const k = params.drag;
                        const x = (vx0 / k) * (1 - Math.exp(-k * time));
                        const y = params.h0 + (1 / k) * (vy0 + params.g / k) * (1 - Math.exp(-k * time)) - (params.g * time) / k;
                        const vx = vx0 * Math.exp(-k * time);
                        const vy = (vy0 + params.g / k) * Math.exp(-k * time) - params.g / k;
                        return { x, y, vx, vy };
                    }
                };

                const updateControlsPanel = () => {
                    const controls = document.getElementById('sim-controls-sidebar');
                    controls.innerHTML = `
                        <div class="sidebar-panel">
                            <h3 class="sidebar-panel-title">Initial Configuration</h3>
                            
                            <div class="control-group">
                                <div class="control-label-wrapper">
                                    <span class="control-label">Launch Velocity (v₀)</span>
                                    <span class="control-value" id="val-v0">${params.v0} m/s</span>
                                </div>
                                <input type="range" class="sim-slider" id="slider-v0" min="5" max="50" step="1" value="${params.v0}">
                            </div>

                            <div class="control-group">
                                <div class="control-label-wrapper">
                                    <span class="control-label">Launch Angle (θ)</span>
                                    <span class="control-value" id="val-theta">${params.theta}°</span>
                                </div>
                                <input type="range" class="sim-slider" id="slider-theta" min="0" max="90" step="1" value="${params.theta}">
                            </div>

                            <div class="control-group">
                                <div class="control-label-wrapper">
                                    <span class="control-label">Initial Height (h₀)</span>
                                    <span class="control-value" id="val-h0">${params.h0} m</span>
                                </div>
                                <input type="range" class="sim-slider" id="slider-h0" min="0" max="25" step="1" value="${params.h0}">
                            </div>

                            <div class="control-group">
                                <div class="control-label-wrapper">
                                    <span class="control-label">Gravitational Field (g)</span>
                                    <span class="control-value" id="val-g">${params.g} m/s²</span>
                                </div>
                                <input type="range" class="sim-slider" id="slider-g" min="1" max="25" step="0.1" value="${params.g}">
                            </div>

                            <div class="control-group">
                                <div class="control-label-wrapper">
                                    <span class="control-label">Air Drag Coefficient (γ)</span>
                                    <span class="control-value" id="val-drag">${params.drag.toFixed(2)}</span>
                                </div>
                                <input type="range" class="sim-slider" id="slider-drag" min="0" max="0.8" step="0.05" value="${params.drag}">
                            </div>
                        </div>

                        <div class="sidebar-panel">
                            <h3 class="sidebar-panel-title">Telemetry Readouts</h3>
                            <div class="instrumentation-list">
                                <div class="instrumentation-item">
                                    <span class="instrument-label">Flight Time (t)</span>
                                    <span class="instrument-value" id="tele-t">0.000 s</span>
                                </div>
                                <div class="instrumentation-item">
                                    <span class="instrument-label">Horizontal Range (x)</span>
                                    <span class="instrument-value" id="tele-x">0.000 m</span>
                                </div>
                                <div class="instrumentation-item">
                                    <span class="instrument-label">Current Altitude (y)</span>
                                    <span class="instrument-value" id="tele-y">0.000 m</span>
                                </div>
                                <div class="instrumentation-item">
                                    <span class="instrument-label">Velocity vector (v)</span>
                                    <span class="instrument-value" id="tele-v">0.000 m/s</span>
                                </div>
                            </div>
                        </div>
                    `;

                    // Bind listeners
                    const bindSlider = (id, targetKey, valId, suffix) => {
                        document.getElementById(id).addEventListener('input', (e) => {
                            params[targetKey] = parseFloat(e.target.value);
                            document.getElementById(valId).textContent = params[targetKey] + suffix;
                            resetSim();
                        });
                    };

                    bindSlider('slider-v0', 'v0', 'val-v0', ' m/s');
                    bindSlider('slider-theta', 'theta', 'val-theta', '°');
                    bindSlider('slider-h0', 'h0', 'val-h0', ' m');
                    bindSlider('slider-g', 'g', 'val-g', ' m/s²');
                    
                    document.getElementById('slider-drag').addEventListener('input', (e) => {
                        params.drag = parseFloat(e.target.value);
                        document.getElementById('val-drag').textContent = params.drag.toFixed(2);
                        resetSim();
                    });
                };

                const updateEduPanel = () => {
                    const edu = document.getElementById('sim-edu-content');
                    edu.innerHTML = `
                        <div class="edu-section">
                            <h3>Theoretical Analysis</h3>
                            <p>An idealized projectile moves under horizontal inertia and vertical gravity. With linear Stokes drag force acting opposite to the instantaneous velocity path vector ($F_d = -\gamma \vec{v}$), the equation of motion is decoupled as:</p>
                            
                            <div class="equation-card">
                                <div class="equation-raw">m \\frac{d\\vec{v}}{dt} = m\\vec{g} - \\gamma\\vec{v}</div>
                                <div class="equation-variables">
                                    <span><strong>&gamma;</strong> — Drag Coefficient</span>
                                    <span><strong>v</strong> — Instantaneous velocity</span>
                                    <span><strong>g</strong> — Local gravity acceleration</span>
                                </div>
                            </div>
                        </div>
                        <div class="edu-section">
                            <div class="try-challenge-box">
                                <h4>Interactive Challenges</h4>
                                <p>1. <strong>Optimize trajectory:</strong> Set drag ($\gamma$) to 0. Find the launch angle that maximizes horizontal range.</p>
                                <p>2. <strong>Terminal deceleration:</strong> Push the air drag parameter up to 0.8 and note how the trajectory shifts from a standard parabolic arch into an asymmetric decay curve.</p>
                            </div>
                        </div>
                    `;
                };

                const resetSim = () => {
                    t = 0;
                    path = [];
                    finished = false;
                };

                document.getElementById('btn-reset-proj').onclick = () => resetSim();
                const playBtn = document.getElementById('btn-play-proj');
                playBtn.onclick = () => {
                    params.play = !params.play;
                    playBtn.classList.toggle('active', params.play);
                };

                updateControlsPanel();
                updateEduPanel();

                let animId;
                const renderLoop = () => {
                    if (!canvas || !canvas.getContext) return;
                    
                    const w = canvas.width / window.devicePixelRatio;
                    const h = canvas.height / window.devicePixelRatio;
                    ctx.clearRect(0, 0, w, h);

                    // Physics update
                    if (params.play && !finished) {
                        t += 0.04;
                        const state = getPositionAt(t);
                        if (state.y < 0 && t > 0.1) {
                            finished = true;
                        } else {
                            path.push(state);
                        }
                    }

                    // Scalings (Metres to canvas pixels)
                    const scaleX = (w - 100) / 100; // Assume 100m width domain
                    const scaleY = (h - 100) / 50;  // Assume 50m height domain
                    const originX = 50;
                    const originY = h - 50;

                    const toCanvasX = (mx) => originX + mx * scaleX;
                    const toCanvasY = (my) => originY - my * scaleY;

                    // Draw coordinate axis
                    ctx.strokeStyle = '#20262d';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(originX, 0); ctx.lineTo(originX, h);
                    ctx.moveTo(0, originY); ctx.lineTo(w, originY);
                    ctx.stroke();

                    // Grid text label markers
                    ctx.fillStyle = '#484f58';
                    ctx.font = '9px monospace';
                    for (let xDist = 0; xDist <= 100; xDist += 20) {
                        ctx.fillText(`${xDist}m`, toCanvasX(xDist) - 10, originY + 16);
                    }
                    for (let yDist = 10; yDist <= 50; yDist += 10) {
                        ctx.fillText(`${yDist}m`, originX - 30, toCanvasY(yDist) + 4);
                    }

                    // Render traced trajectory line
                    if (path.length > 0) {
                        ctx.strokeStyle = 'rgba(0, 240, 255, 0.4)';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(toCanvasX(0), toCanvasY(params.h0));
                        for (let step of path) {
                            ctx.lineTo(toCanvasX(step.x), toCanvasY(step.y));
                        }
                        ctx.stroke();

                        // Current active object point
                        const current = path[path.length - 1];
                        ctx.fillStyle = 'var(--accent-cyan)';
                        ctx.beginPath();
                        ctx.arc(toCanvasX(current.x), toCanvasY(current.y), 6, 0, Math.PI * 2);
                        ctx.fill();

                        // Render Velocity Vector Arrow (Cyan)
                        const vectorFactor = 0.5;
                        ctx.strokeStyle = 'var(--accent-orange)';
                        ctx.lineWidth = 1.5;
                        ctx.beginPath();
                        ctx.moveTo(toCanvasX(current.x), toCanvasY(current.y));
                        ctx.lineTo(
                            toCanvasX(current.x + current.vx * vectorFactor), 
                            toCanvasY(current.y + current.vy * vectorFactor)
                        );
                        ctx.stroke();

                        // Telemetry output labels
                        document.getElementById('tele-t').textContent = t.toFixed(3) + ' s';
                        document.getElementById('tele-x').textContent = current.x.toFixed(2) + ' m';
                        document.getElementById('tele-y').textContent = Math.max(0, current.y).toFixed(2) + ' m';
                        document.getElementById('tele-v').textContent = Math.hypot(current.vx, current.vy).toFixed(2) + ' m/s';
                    } else {
                        // Reset Telemetry display
                        document.getElementById('tele-t').textContent = '0.000 s';
                        document.getElementById('tele-x').textContent = '0.000 m';
                        document.getElementById('tele-y').textContent = params.h0.toFixed(2) + ' m';
                        document.getElementById('tele-v').textContent = params.v0.toFixed(2) + ' m/s';

                        // Starting state visualization
                        ctx.fillStyle = 'var(--accent-cyan)';
                        ctx.beginPath();
                        ctx.arc(toCanvasX(0), toCanvasY(params.h0), 6, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    animId = requestAnimationFrame(renderLoop);
                };

                renderLoop();

                // Cleanup hook
                this.destroy = () => {
                    cancelAnimationFrame(animId);
                    window.removeEventListener('resize', resize);
                };
            }
        };
